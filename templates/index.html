<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面试翻车救援队</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #FF6B6B;
            --primary-light: #FF8E8E;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --bg-dark: #2D3436;
            --bg-card: #3A3F44;
            --text-primary: #FFFFFF;
            --text-secondary: #B2BEC3;
            --border: #4A4F55;
            --shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
            color: var(--text-primary);
        }
        
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .nav-links {
            display: flex;
            gap: 30px;
        }
        
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .nav-links a:hover { color: var(--primary); }
        
        .hero {
            text-align: center;
            padding: 80px 40px;
        }
        
        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .hero p {
            font-size: 1.3rem;
            color: var(--text-secondary);
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 40px;
            background: linear-gradient(135deg, var(--primary) 0%, #FF4757 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(255,107,107,0.4);
        }
        
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255,107,107,0.5);
        }
        
        .features {
            padding: 60px 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        
        .feature-card {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            transition: transform 0.3s;
        }
        
        .feature-card:hover { transform: translateY(-10px); }
        
        .feature-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        
        .feature-card h3 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--text-primary);
        }
        
        .feature-card p {
            color: var(--text-secondary);
            line-height: 1.6;
        }
        
        .badges-preview {
            padding: 60px 40px;
            text-align: center;
        }
        
        .badges-preview h2 {
            font-size: 2rem;
            margin-bottom: 40px;
        }
        
        .badges-grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .badge-item {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            min-width: 150px;
            transition: transform 0.3s;
        }
        
        .badge-item:hover { transform: scale(1.1); }
        
        .badge-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        .badge-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .badge-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .footer {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            background: rgba(255,255,255,0.03);
        }
        
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            .hero p { font-size: 1.1rem; }
            .nav-bar { padding: 15px 20px; }
            .nav-links { gap: 15px; }
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <div class="logo">
            <span>🚑</span>
            <span>面试翻车救援队</span>
        </div>
        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/checkin">开始复盘</a>
            <a href="/badges">徽章馆</a>
            <a href="/rescue">话术库</a>
            <a href="/user/profile">个人中心</a>
        </div>
    </nav>
    
    <section class="hero">
        <h1>面试翻车救援队</h1>
        <p>把面试失败变成可收集的成就徽章，让复盘像玩游戏一样上瘾</p>
        <button class="cta-button" onclick="window.location.href='/checkin'">
            <span>🚀</span>
            开始复盘
        </button>
    </section>
    
    <section class="features">
        <div class="feature-card">
            <div class="feature-icon">🎮</div>
            <h3>游戏化复盘体验</h3>
            <p>每次面试复盘都能解锁独特徽章，让失败变成收集成就的动力</p>
        </div>
        <div class="feature-card">
            <div class="feature-icon">💬</div>
            <h3>即时救援话术</h3>
            <p>针对各种翻车场景，提供现成的圆场话术，帮你化险为夷</p>
        </div>
        <div class="feature-card">
            <div class="feature-icon">✅</div>
            <h3>可执行行动清单</h3>
            <p>基于你的复盘，生成3条具体可执行的改进建议，助你快速成长</p>
        </div>
    </section>
    
    <section class="badges-preview">
        <h2>🏆 成就徽章展示</h2>
        <div class="badges-grid">
            <div class="badge-item">
                <div class="badge-icon">🎯</div>
                <div class="badge-name">初出茅庐</div>
                <div class="badge-desc">完成第一次复盘</div>
            </div>
            <div class="badge-item">
                <div class="badge-icon">🙈</div>
                <div class="badge-name">说错话大师</div>
                <div class="badge-desc">勇敢面对说错话</div>
            </div>
            <div class="badge-item">
                <div class="badge-icon">⚡</div>
                <div class="badge-name">卡壳终结者</div>
                <div class="badge-desc">突破面试卡壳困境</div>
            </div>
            <div class="badge-item">
                <div class="badge-icon">🏆</div>
                <div class="badge-name">面面俱到</div>
                <div class="badge-desc">解锁所有翻车类型徽章</div>
            </div>
        </div>
    </section>
    
    <footer class="footer">
        <p>© 2026 面试翻车救援队 | 让每次失败都成为成长的勋章</p>
    </footer>
</body>
</html>
