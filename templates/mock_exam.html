<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟练习 - 百工模拟考场</title>
    <style>
        :root {
            --primary: #60A5FA;
            --primary-hover: #3B82F6;
            --bg-primary: #F8FAFC;
            --bg-secondary: #FFFFFF;
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --border: rgba(0, 0, 0, 0.06);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, SF Pro Display, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
        }
        
        .sidebar {
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo { font-size: 1.75rem; }
        .brand-name { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); }
        
        .nav-menu { flex: 1; padding: 12px; }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            margin-bottom: 4px;
        }
        
        .nav-item:hover { background: rgba(96, 165, 250, 0.08); color: var(--primary); }
        .nav-item.active { background: rgba(96, 165, 250, 0.12); color: var(--primary); font-weight: 500; }
        .nav-item-icon { font-size: 1.2rem; }
        
        .main-content {
            flex: 1;
            margin-left: 260px;
            min-height: 100vh;
        }
        
        .top-bar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .page-title { font-size: 1.25rem; font-weight: 600; color: var(--text-primary); }
        
        .page-content { padding: 24px; }
        
        .scenarios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .scenario-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
            border: 2px solid transparent;
        }
        
        .scenario-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
            border-color: var(--primary);
        }
        
        .scenario-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        
        .scenario-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .scenario-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.5;
        }
        
        .scenario-stats {
            display: flex;
            gap: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        
        .stat-item {
            text-align: center;
            flex: 1;
        }
        
        .stat-num {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary);
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }
        
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: relative; height: auto; }
            .main-content { margin-left: 0; }
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/sidebar.css') }}">
</head>
<body>
    {% include 'components/sidebar.html' %}

    <main class="main-content">
        <header class="top-bar">
            <h1 class="page-title">模拟练习</h1>
        </header>
        
        <div class="page-content">
            <div class="scenarios-grid">
                <div class="scenario-card" onclick="navigateTo('/chat/job_interview')">
                    <div class="scenario-icon">💼</div>
                    <div class="scenario-name">求职面试</div>
                    <div class="scenario-desc">模拟真实求职场景，AI考官一对一面试辅导</div>
                    <div class="scenario-stats">
                        <div class="stat-item"><div class="stat-num">5</div><div class="stat-label">题目</div></div>
                        <div class="stat-item"><div class="stat-num">3</div><div class="stat-label">练习</div></div>
                    </div>
                </div>
                
                <div class="scenario-card" onclick="navigateTo('/chat/teacher_cert')">
                    <div class="scenario-icon">🍎</div>
                    <div class="scenario-name">教资面试</div>
                    <div class="scenario-desc">教师资格证面试模拟，专业评委点评</div>
                    <div class="scenario-stats">
                        <div class="stat-item"><div class="stat-num">3</div><div class="stat-label">题目</div></div>
                        <div class="stat-item"><div class="stat-num">1</div><div class="stat-label">练习</div></div>
                    </div>
                </div>
                
                <div class="scenario-card" onclick="navigateTo('/chat/ielts_speaking')">
                    <div class="scenario-icon">🌍</div>
                    <div class="scenario-name">雅思口语</div>
                    <div class="scenario-desc">雅思口语模拟考试，提升表达能力</div>
                    <div class="scenario-stats">
                        <div class="stat-item"><div class="stat-num">2</div><div class="stat-label">题目</div></div>
                        <div class="stat-item"><div class="stat-num">0</div><div class="stat-label">练习</div></div>
                    </div>
                </div>
                
                <div class="scenario-card" onclick="navigateTo('/chat/civil_service')">
                    <div class="scenario-icon">⚖️</div>
                    <div class="scenario-name">公务员面试</div>
                    <div class="scenario-desc">公务员结构化面试模拟训练</div>
                    <div class="scenario-stats">
                        <div class="stat-item"><div class="stat-num">2</div><div class="stat-label">题目</div></div>
                        <div class="stat-item"><div class="stat-num">0</div><div class="stat-label">练习</div></div>
                    </div>
                </div>
                
                <div class="scenario-card" onclick="navigateTo('/chat/graduate_school')">
                    <div class="scenario-icon">🎓</div>
                    <div class="scenario-name">考研复试</div>
                    <div class="scenario-desc">研究生复试面试模拟，专业问题训练</div>
                    <div class="scenario-stats">
                        <div class="stat-item"><div class="stat-num">2</div><div class="stat-label">题目</div></div>
                        <div class="stat-item"><div class="stat-num">0</div><div class="stat-label">练习</div></div>
                    </div>
                </div>
                
                <div class="scenario-card" onclick="navigateTo('/chat/mba_interview')">
                    <div class="scenario-icon">💎</div>
                    <div class="scenario-name">MBA面试</div>
                    <div class="scenario-desc">MBA入学面试模拟，案例分析训练</div>
                    <div class="scenario-stats">
                        <div class="stat-item"><div class="stat-num">2</div><div class="stat-label">题目</div></div>
                        <div class="stat-item"><div class="stat-num">0</div><div class="stat-label">练习</div></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <script src="{{ url_for('static', filename='js/components/sidebar.js') }}"></script>
</body>
</html>
