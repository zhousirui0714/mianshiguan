<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI考官模拟面试</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/home.css">
    <link rel="stylesheet" href="/static/css/interview.css">
    <link rel="stylesheet" href="/static/css/components/digital_examiner.css">
    <link rel="stylesheet" href="/static/css/video-preview.css">
    <script src="/static/js/components/digital_examiner.js"></script>
    <style>
        /* Override nav for light theme consistency */
        .nav-bar {
            position: relative !important;
        }

        body {
            background: #F8FAFC !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
        }

        /* 隐藏聊天框两边的圆形头像框，只保留对话框和面试官虚拟形象 */
        .iv-msg-avatar {
            display: none !important;
        }
        .iv-msg {
            gap: 0 !important;
        }

        /* Video preview adjustments for light theme */
        .video-preview-container {
            border: 1px solid #E5E7EB !important;
            border-radius: 12px !important;
        }

        .video-privacy-notice {
            color: #64748B !important;
        }

        /* Digital examiner in left panel */
        .iv-examiner-section .examiner-container {
            --examiner-width: 100%;
        }

        /* Right panel scroll */
        .interview-right {
            scrollbar-width: thin;
        }

        /* Scenario info card */
        .iv-scenario-info {
            padding: 4px 0;
        }
        .iv-scenario-info .iv-info-row {
            margin-bottom: 14px;
        }
        .iv-scenario-info .iv-info-row:last-of-type {
            margin-bottom: 16px;
        }
        .iv-info-note {
            font-size: 12px;
            color: #94A3B8;
            line-height: 1.5;
            padding: 10px 12px;
            background: rgba(59, 130, 246, 0.04);
            border-radius: 8px;
            border: 1px solid rgba(59, 130, 246, 0.08);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .interview-right .iv-card {
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
{% include 'components/nav.html' %}

<div class="interview-layout">
    <!-- ===== Left Panel — Examiner Info ===== -->
    <div class="interview-left">
        <!-- Examiner card -->
        <div class="iv-card iv-examiner-section">
            <div id="examiner-container"></div>
        </div>

        <!-- Interview info -->
        <div class="iv-card">
            <div class="iv-card-header">
                <div class="iv-card-title">&#128203; 面试信息</div>
            </div>
            <div class="iv-info-row">
                <span class="label">进度</span>
                <span class="value" id="roundInfo">面试进行中</span>
            </div>
            <div class="iv-info-row">
                <span class="label">考官</span>
                <span class="value" id="examinerSideName">考官</span>
            </div>
            <div class="iv-info-row" id="styleRow" style="display:none;">
                <span class="label">风格</span>
                <span class="value" id="styleLabel"></span>
            </div>
        </div>

        <!-- Panel Members (panel mode only) -->
        <div class="iv-card" id="panelMembersCard" style="display:none;">
            <div class="iv-card-header">
                <div class="iv-card-title">👥 面试委员</div>
            </div>
            <div id="panelMembersList" style="padding:8px 0;">
            </div>
        </div>

        <!-- Tips -->
        <div class="iv-card">
            <div class="iv-card-header">
                <div class="iv-card-title">&#128161; 提示</div>
            </div>
            <div style="font-size:13px;color:#64748B;line-height:1.6;">
                完整清晰地回答问题，结合具体经历和案例。每次回答后考官会给出反馈。
            </div>
        </div>
    </div>

    <!-- ===== Center Panel — Chat ===== -->
    <div class="interview-center">
        <!-- Header -->
        <div class="iv-chat-header">
            <div class="iv-chat-header-left">
                <span class="iv-chat-title">&#128172; 面试对话</span>
                <span class="iv-chat-badge" id="scenarioBadge">求职面试</span>
            </div>
            <div class="iv-chat-actions">
                <div class="video-preview-container video-hidden" id="video-preview">
                    <div class="video-recording-indicator" id="video-recording-indicator">
                        <span class="video-record-dot"></span>
                        <span class="video-recording-timer" id="video-recording-timer">00:00</span>
                    </div>
                    <div class="video-privacy-notice" id="video-privacy-notice" style="display:none;">
                        &#128274; 仅本地保存，不上传服务器
                    </div>
                </div>
                <button class="iv-btn iv-btn-secondary video-toggle-btn" id="video-toggle-btn">&#127908; 录制</button>
                <button class="iv-btn iv-btn-danger" id="finishBtn">结束面试</button>
            </div>
        </div>

        <!-- Messages -->
        <div class="iv-messages" id="messagesContainer">
            <!-- Messages dynamically added -->
        </div>

        <!-- Input -->
        <div class="iv-input-area">
            <div class="iv-input-row">
                <textarea class="iv-input" id="messageInput"
                    placeholder="输入你的回答..."
                    onkeydown="handleKeydown(event)"
                ></textarea>
                <button class="iv-btn-send" id="sendBtn" onclick="sendMessage()" disabled>
                    &#10140;
                </button>
            </div>
        </div>
    </div>

    <!-- ===== Right Panel — Scoring ===== -->
    <div class="interview-right">
        <!-- Score -->
        <div class="iv-card">
            <div class="iv-card-header">
                <div class="iv-card-title">&#127942; 当前评分</div>
            </div>
            <div class="iv-score-display" id="scoreDisplay">
                <div class="iv-score-empty">
                    开始面试后将显示实时评分
                </div>
            </div>
        </div>

        <!-- Ability Dimensions -->
        <div class="iv-card">
            <div class="iv-card-header">
                <div class="iv-card-title">&#128200; 能力维度</div>
            </div>
            <div id="dimensionsContainer">
                <div class="iv-dimension">
                    <div class="iv-dimension-header">
                        <span class="iv-dimension-name">专业能力</span>
                        <span class="iv-dimension-score">--</span>
                    </div>
                    <div class="iv-dimension-bar">
                        <div class="fill" style="width:0%"></div>
                    </div>
                </div>
                <div class="iv-dimension">
                    <div class="iv-dimension-header">
                        <span class="iv-dimension-name">沟通表达</span>
                        <span class="iv-dimension-score">--</span>
                    </div>
                    <div class="iv-dimension-bar">
                        <div class="fill" style="width:0%"></div>
                    </div>
                </div>
                <div class="iv-dimension">
                    <div class="iv-dimension-header">
                        <span class="iv-dimension-name">逻辑思维</span>
                        <span class="iv-dimension-score">--</span>
                    </div>
                    <div class="iv-dimension-bar">
                        <div class="fill" style="width:0%"></div>
                    </div>
                </div>
                <div class="iv-dimension">
                    <div class="iv-dimension-header">
                        <span class="iv-dimension-name">综合素养</span>
                        <span class="iv-dimension-score">--</span>
                    </div>
                    <div class="iv-dimension-bar">
                        <div class="fill" style="width:0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Scenario Info -->
        <div class="iv-card">
            <div class="iv-card-header">
                <div class="iv-card-title">&#128203; 场景信息</div>
            </div>
            <div class="iv-scenario-info">
                <div class="iv-info-row">
                    <span class="label">面试形式</span>
                    <span class="value" id="scenarioFormat">--</span>
                </div>
                <div class="iv-info-row">
                    <span class="label">考察重点</span>
                    <span class="value" id="scenarioFocus">--</span>
                </div>
                <div class="iv-info-note">
                    问题数量和追问深度将根据你的回答实时调整
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Report Modal -->
<div class="iv-modal-overlay" id="reportModal" style="display: none;">
    <div class="iv-modal">
        <div class="iv-modal-header">
            <div class="iv-modal-title">&#127919; 面试评估报告</div>
            <button class="iv-modal-close" onclick="closeReportModal()">&#10005;</button>
        </div>
        <div class="iv-modal-body" id="reportContent">
            <!-- Report content dynamically generated -->
        </div>
        <div class="iv-modal-footer">
            <button class="iv-btn iv-btn-secondary" onclick="closeReportModal()">关闭</button>
            <button class="iv-btn iv-btn-primary" id="viewFullReportBtn" style="display:none;">查看完整报告</button>
            <button class="iv-btn iv-btn-primary" onclick="restartInterview()">再来一次</button>
        </div>
    </div>
</div>

<script>
    // ================================================================
    // Global state
    // ================================================================
    let conversationId = null;
    let scenarioId = '{{ scenario_id }}';
    let currentRound = 1;
    let maxRounds = 5;
    let interviewStyle = '';
    let currentUserId = '{{ g.current_user.id if g.current_user else "" }}';

    const STYLE_MAP = {
        standard: { name: '标准型', icon: '⚖️' },
        strict: { name: '严格型', icon: '🔍' },
        guiding: { name: '引导型', icon: '💡' },
        pressure: { name: '压力型', icon: '⏱️' },
        gentle: { name: '温和型', icon: '🌱' },
    };
    let isTyping = false;

    // ================================================================
    // DOM refs
    // ================================================================
    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const roundInfo = document.getElementById('roundInfo');
    const examinerSideName = document.getElementById('examinerSideName');
    const finishBtn = document.getElementById('finishBtn');
    const reportModal = document.getElementById('reportModal');

    // ================================================================
    // Scenario config
    // ================================================================
    const scenarioIcons = {
        'job_interview': '&#128084;',
        'teacher_cert': '&#128105;&#8205;&#127979;',
        'ielts_speaking': '&#128104;&#8205;&#127979;',
        'civil_service': '&#128104;&#8205;&#9878;&#65039;',
        'graduate_school': '&#127891;',
        'mba_interview': '&#128188;'
    };

    const scenarioLabels = {
        'job_interview': '求职面试',
        'teacher_cert': '教资面试',
        'civil_service': '公务员面试',
        'graduate_school': '考研复试',
        'mba_interview': 'MBA面试',
        'ielts_speaking': '雅思口语'
    };

    // Scenario info data
    const scenarioInfo = {
        'job_interview': {
            format: '技术面试 + 项目深挖 + 情景问题',
            focus: '专业技能、项目经验、解决问题能力、团队协作'
        },
        'teacher_cert': {
            format: '结构化问答 + 情景模拟 + 深度追问',
            focus: '教育理念、课堂管理、教学设计、应变能力'
        },
        'civil_service': {
            format: '结构化面试 + 时政分析 + 情景应变',
            focus: '政策理解、综合分析、组织协调、应急处理'
        },
        'graduate_school': {
            format: '英语问答 + 专业课问答 + 综合素质考察',
            focus: '专业基础、科研潜力、项目经历、学术视野'
        },
        'mba_interview': {
            format: '背景评估 + 管理能力 + 领导力追问',
            focus: '管理经验、战略思维、领导潜力、职业规划'
        },
        'ielts_speaking': {
            format: 'Part 1/2/3 渐进式口语测试',
            focus: 'Fluency & Coherence, Lexical Resource, Grammatical Range & Accuracy, Pronunciation'
        }
    };

    const EXPR_MAP = {
        'idle':          'neutral',
        'greeting':      'smile',
        'listening':     'neutral',
        'thinking':      'thinking',
        'approving':     'smile',
        'disapproving':  'neutral',
    };

    // ================================================================
    // Init
    // ================================================================
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('scenarioBadge').textContent =
            scenarioLabels[scenarioId] || scenarioId;

        // Parse style from URL
        interviewStyle = (new URLSearchParams(window.location.search)).get('style') || '';

        // Populate scenario info
        const info = scenarioInfo[scenarioId];
        if (info) {
            document.getElementById('scenarioFormat').textContent = info.format;
            document.getElementById('scenarioFocus').textContent = info.focus;
        }

        messageInput.addEventListener('input', () => {
            sendBtn.disabled = !messageInput.value.trim();
        });
        initDigitalExaminer();

        VideoRecorder.init({
            containerId: 'video-preview',
            onStateChange: function(state) {
                updateVideoUI(state);
            }
        });

        startInterview();
    });

    function initDigitalExaminer() {
        try {
            Examiner.init({
                scenario: scenarioId,
                containerId: 'examiner-container',
                examinerInfo: {
                    name: '考官',
                    title: '',
                }
            });
        } catch (e) {
            console.warn('Examiner init failed:', e);
        }
    }

    function setExaminerExpression(oldExpr) {
        var expr = EXPR_MAP[oldExpr] || oldExpr || 'neutral';
        Examiner.setExpression(expr);
    }

    // ================================================================
    // Video
    // ================================================================
    const videoToggleBtn = document.getElementById('video-toggle-btn');
    videoToggleBtn.addEventListener('click', async () => {
        const state = VideoRecorder.getState();
        if (state === 'idle' || state === 'preview') {
            try {
                await VideoRecorder.startPreview();
                if (conversationId) {
                    VideoRecorder.start(conversationId);
                }
            } catch (err) {
                alert('无法访问摄像头，请检查权限设置。\n你可以继续面试，视频功能将被跳过。');
            }
        } else if (state === 'recording') {
            VideoRecorder.stop();
        }
    });

    function updateVideoUI(state) {
        const indicator = document.getElementById('video-recording-indicator');
        if (state === 'recording') {
            indicator.classList.add('active');
        } else {
            indicator.classList.remove('active');
        }
        const privacy = document.getElementById('video-privacy-notice');
        if (state === 'preview' || state === 'recording') {
            privacy.style.display = '';
        } else {
            privacy.style.display = 'none';
        }
    }

    // ================================================================
    // URL params
    // ================================================================
    function getUrlParams() {
        const params = new URLSearchParams(window.location.search);
        return {
            position: params.get('position') || '',
            company: params.get('company') || '',
            resume: params.get('resume') || '',
            subject: params.get('subject') || '',
            level: params.get('level') || '',
            school: params.get('school') || '',
            major: params.get('major') || '',
            department: params.get('department') || '',
        };
    }

    function buildUserBackground() {
        const urlParams = getUrlParams();
        const parts = [];
        if (urlParams.position) parts.push('目标岗位：' + urlParams.position);
        if (urlParams.company) parts.push('目标公司：' + urlParams.company);
        if (urlParams.subject) parts.push('报考科目：' + urlParams.subject);
        if (urlParams.level) parts.push('报考学段：' + urlParams.level);
        if (urlParams.school) parts.push('目标院校：' + urlParams.school);
        if (urlParams.major) parts.push('目标专业：' + urlParams.major);
        if (urlParams.department) parts.push('报考单位：' + urlParams.department);
        if (urlParams.resume) parts.push('个人简历：\n' + urlParams.resume);
        return parts.join('\n');
    }

    // ================================================================
    // Interview flow
    // ================================================================
    // 读取 URL 中的面试模式
    const urlParams = new URLSearchParams(window.location.search);
    const interviewMode = urlParams.get('mode') || 'single';
    let panelMembers = [];

    async function startInterview() {
        try {
            const userBg = buildUserBackground();
            const response = await fetch('/api/examiner/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    scenario_id: scenarioId,
                    user_id: currentUserId || 'anonymous',
                    user_background: userBg,
                    interview_style: interviewStyle,
                    mode: interviewMode
                })
            });

            const result = await response.json();

            if (result.success) {
                conversationId = result.conversation_id;
                examinerSideName.textContent = result.examiner_name;
                maxRounds = result.max_rounds;

                // 面板模式：显示考官列表
                if (result.mode === 'panel' && result.panel_members && result.panel_members.length > 0) {
                    panelMembers = result.panel_members;
                    var panelHtml = '';
                    panelMembers.forEach(function(m) {
                        panelHtml += '<div style="font-size:12px;color:#64748B;padding:2px 0;">' +
                            (m.role === 'lead' ? '🎤 ' : '💬 ') + m.name + ' — ' + m.focus + '</div>';
                    });
                    document.getElementById('panelMembersList').innerHTML = panelHtml;
                    document.getElementById('panelMembersCard').style.display = '';
                } else {
                    document.getElementById('panelMembersCard').style.display = 'none';
                }

                // 显示面试风格
                var style = result.interview_style || interviewStyle;
                if (style && STYLE_MAP[style]) {
                    var si = STYLE_MAP[style];
                    document.getElementById('styleLabel').textContent = si.icon + ' ' + si.name;
                    document.getElementById('styleRow').style.display = '';
                }

                Examiner.init({
                    scenario: scenarioId,
                    containerId: 'examiner-container',
                    examinerInfo: {
                        name: result.examiner_name,
                        title: result.examiner_title,
                    }
                });

                setTimeout(function () {
                    Examiner.setExpression('smile');
                    setTimeout(function () {
                        Examiner.setExpression('neutral');
                    }, 2000);
                }, 500);

                updateRoundInfo(1);
                addMessage('assistant', result.welcome_message);
            }
        } catch (error) {
            console.error('启动面试失败:', error);
            addMessage('assistant', '抱歉，服务暂时不可用，请稍后重试。');
        }
    }

    async function sendMessage() {
        const content = messageInput.value.trim();
        if (!content || isTyping) return;

        addMessage('user', content);
        messageInput.value = '';
        sendBtn.disabled = true;

        Examiner.setExpression('neutral');

        isTyping = true;
        const typingElement = createTypingIndicator();
        messagesContainer.appendChild(typingElement);
        scrollToBottom();

        try {
            const response = await fetch('/api/examiner/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    conversation_id: conversationId,
                    scenario_id: scenarioId,
                    user_message: content,
                    user_id: currentUserId || 'anonymous',
                    interview_style: interviewStyle
                })
            });

            const result = await response.json();

            messagesContainer.removeChild(typingElement);
            isTyping = false;

            Examiner.setExpression('thinking');

            if (result.success) {
                conversationId = result.conversation_id;
                currentRound = result.round_count;
                updateRoundInfo(currentRound, maxRounds);

                // 面板模式：如果有插话，也更新考官信息
                if (result.mode === 'panel' && result.panel_members) {
                    panelMembers = result.panel_members;
                }

                await new Promise(r => setTimeout(r, 600));
                Examiner.startSpeaking();
                await typewriterMessage('assistant', result.response);
                Examiner.stopSpeaking();

                // 面板插话：逐条显示
                if (result.interjections && result.interjections.length > 0) {
                    for (var ij of result.interjections) {
                        await new Promise(r => setTimeout(r, 800));
                        Examiner.setExpression('thinking');
                        await typewriterMessage('assistant-interjection',
                            '<span style="color:#7C3AED;font-weight:600;">' + ij.name + '：</span>' + ij.content);
                        Examiner.stopSpeaking();
                        await new Promise(r => setTimeout(r, 400));
                        Examiner.setExpression('neutral');
                    }
                }

                const responseText = result.response || '';
                const approvingWords = ['不错', '很好', '优秀', '正确', 'excellent', 'great', 'good', 'impressive'];
                const disapprovingWords = ['不足', '需要改进', '建议', 'improve', 'suggestion', 'consider', 'could be better'];
                const isApproving = approvingWords.some(w => responseText.toLowerCase().includes(w.toLowerCase()));

                if (isApproving) {
                    Examiner.setExpression('smile');
                } else {
                    Examiner.setExpression('neutral');
                }

                setTimeout(function () {
                    Examiner.setExpression('neutral');
                }, 3000);
            } else {
                addMessage('assistant', '抱歉，AI 服务暂时繁忙，请稍后点击发送按钮重试。');
                Examiner.setExpression('neutral');
            }
        } catch (error) {
            console.error('发送消息失败:', error);
            if (typingElement.parentNode) messagesContainer.removeChild(typingElement);
            isTyping = false;
            addMessage('assistant', '网络错误，请检查网络连接后刷新页面重试。');
        }
    }

    // ================================================================
    // UI helpers
    // ================================================================
    function updateRoundInfo(round, total) {
        roundInfo.textContent = '已进行 ' + round + ' 轮';
    }

    async function typewriterMessage(role, content) {
        const messageElement = createMessageElement(role, '');
        messagesContainer.appendChild(messageElement);
        const contentElement = messageElement.querySelector('.iv-msg-bubble p');
        let index = 0;
        return new Promise((resolve) => {
            const interval = setInterval(() => {
                if (index < content.length) {
                    contentElement.textContent += content[index];
                    index++;
                    scrollToBottom();
                } else {
                    clearInterval(interval);
                    resolve();
                }
            }, 20);
        });
    }

    function addMessage(role, content) {
        const messageElement = createMessageElement(role, content);
        messagesContainer.appendChild(messageElement);
        scrollToBottom();
    }

    function createMessageElement(role, content) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'iv-msg ' + role;

        const avatarDiv = document.createElement('div');
        avatarDiv.className = 'iv-msg-avatar';
        avatarDiv.textContent = role === 'assistant' ? (scenarioIcons[scenarioId] || '&#128084;') : '&#128100;';

        const contentDiv = document.createElement('div');
        contentDiv.className = 'iv-msg-bubble';
        const pElement = document.createElement('p');
        pElement.textContent = content;
        contentDiv.appendChild(pElement);

        messageDiv.appendChild(avatarDiv);
        messageDiv.appendChild(contentDiv);
        return messageDiv;
    }

    function createTypingIndicator() {
        const div = document.createElement('div');
        div.className = 'iv-msg assistant';
        const avatarDiv = document.createElement('div');
        avatarDiv.className = 'iv-msg-avatar';
        avatarDiv.textContent = scenarioIcons[scenarioId] || '&#128084;';
        const contentDiv = document.createElement('div');
        contentDiv.className = 'iv-typing';
        for (let i = 0; i < 3; i++) {
            const dot = document.createElement('span');
            dot.className = 'iv-typing-dot';
            contentDiv.appendChild(dot);
        }
        div.appendChild(avatarDiv);
        div.appendChild(contentDiv);
        return div;
    }

    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function handleKeydown(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    // ================================================================
    // Finish / Report
    // ================================================================
    let isFinishing = false;

    async function finishInterview() {
        if (isFinishing) return;  // 防重复提交
        isFinishing = true;
        finishBtn.disabled = true;
        finishBtn.textContent = '正在生成报告...';

        if (VideoRecorder.getState() === 'recording') {
            try {
                await VideoRecorder.stop();
            } catch (e) {
                console.warn('停止录制失败:', e);
            }
        }

        try {
            const response = await fetch('/api/examiner/finish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ conversation_id: conversationId, mode: interviewMode })
            });
            const result = await response.json();
            if (result.success) {
                showReport(result.report);
            }
        } catch (error) {
            console.error('生成报告失败:', error);
            // 失败时恢复按钮
            isFinishing = false;
            finishBtn.disabled = false;
            finishBtn.textContent = '结束面试';
        }
    }

    finishBtn.addEventListener('click', () => {
        if (isFinishing) return;
        if (confirm('确定要结束本次面试吗？')) {
            finishInterview();
        }
    });

    function showReport(report) {
        let html = `
            <div class="iv-report-score">
                <div class="score-num">${report.overall_score || 'N/A'}</div>
                <div class="score-label">综合得分</div>
            </div>
        `;

        if (report.strengths && report.strengths.length > 0) {
            html += `
                <div class="iv-report-section">
                    <div class="section-title">&#128170; 优势分析</div>
                    ${report.strengths.map(item => `<div class="iv-report-item">${item}</div>`).join('')}
                </div>
            `;
        }

        if (report.improvements && report.improvements.length > 0) {
            html += `
                <div class="iv-report-section">
                    <div class="section-title">&#128221; 改进建议</div>
                    ${report.improvements.map(item => `<div class="iv-report-item">${item}</div>`).join('')}
                </div>
            `;
        }

        if (report.dimensions && report.dimensions.length > 0) {
            html += `
                <div class="iv-report-section">
                    <div class="section-title">&#128202; 各维度评分</div>
                    <div class="iv-report-dims">
                        ${report.dimensions.map(dim => `
                            <div class="iv-report-dim">
                                <div class="dim-name">${dim.name}</div>
                                <div class="dim-bar">
                                    <div class="fill" style="width: ${(dim.score / dim.max_score) * 100}%"></div>
                                </div>
                                <div class="dim-score">${dim.score}/${dim.max_score}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        if (report.overall_comment) {
            html += `
                <div class="iv-report-section">
                    <div class="section-title">&#128220; 总体评价</div>
                    <div class="iv-report-comment" style="white-space:pre-line;line-height:1.9;">${report.overall_comment}</div>
                </div>
            `;
        }

        reportContent.innerHTML = html;
        reportModal.style.display = 'flex';

        var fullBtn = document.getElementById('viewFullReportBtn');
        if (fullBtn && conversationId) {
            fullBtn.style.display = '';
            fullBtn.onclick = function() {
                window.location.href = '/result/' + conversationId;
            };
        }
    }

    function closeReportModal() {
        reportModal.style.display = 'none';
    }

    function restartInterview() {
        closeReportModal();
        messagesContainer.innerHTML = '';
        try { Examiner.destroy(); } catch(e) {}
        currentRound = 1;
        updateRoundInfo(1);
        conversationId = null;
        initDigitalExaminer();
        startInterview();
    }
</script>
<script src="/static/js/video-record.js"></script>
</body>
</html>
