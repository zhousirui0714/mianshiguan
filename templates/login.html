<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — 百工</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --blue-50: #f0f7ff;
            --blue-100: #e0effe;
            --blue-500: #3b82f6;
            --blue-600: #2563eb;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-900: #111827;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--gray-50);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .auth-wrap {
            width: 100%;
            max-width: 400px;
            padding: 24px;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-header .logo {
            font-size: 28px;
            font-weight: 700;
            color: var(--gray-900);
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }
        .auth-header .logo span { color: var(--blue-500); }
        .auth-header p {
            font-size: 14px;
            color: var(--gray-400);
        }
        .auth-card {
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: 20px;
            padding: 36px 32px;
        }
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--gray-200);
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            color: var(--gray-700);
            background: #fff;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: var(--blue-500); }
        .form-input::placeholder { color: var(--gray-400); }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--blue-500);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 4px;
        }
        .btn-submit:hover {
            background: var(--blue-600);
            transform: translateY(-1px);
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--gray-400);
        }
        .auth-footer a {
            color: var(--blue-500);
            font-weight: 600;
            text-decoration: none;
        }
        .auth-footer a:hover { color: var(--blue-600); }
        .guest-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--gray-400);
            text-decoration: none;
        }
        .guest-link:hover { color: var(--gray-500); }
    </style>
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-header">
            <div class="logo">百<span>工</span></div>
            <p>练一次，胜过背十遍</p>
        </div>
        <div class="auth-card">
            <form onsubmit="handleLogin(event)">
                <div id="loginError" style="display:none;background:#FEF2F2;color:#DC2626;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;"></div>
                <div class="form-group">
                    <label class="form-label">邮箱</label>
                    <input type="email" id="loginEmail" class="form-input" placeholder="请输入邮箱" required>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" id="loginPassword" class="form-input" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn-submit" id="loginBtn">登录</button>
            </form>
            <div class="auth-footer">
                还没有账号？<a href="/auth/register">立即注册</a>
            </div>
            <a href="/scenarios" class="guest-link">游客模式体验 →</a>
        </div>
    </div>
    <script>
        function handleLogin(event) {
            event.preventDefault();
            var email = document.getElementById('loginEmail').value.trim();
            var password = document.getElementById('loginPassword').value;
            var err = document.getElementById('loginError');
            var btn = document.getElementById('loginBtn');

            err.style.display = 'none';
            if (!email || !password) {
                err.textContent = '请填写邮箱和密码';
                err.style.display = 'block';
                return;
            }

            btn.textContent = '登录中...';
            btn.disabled = true;

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.success) {
                    window.location.href = '/';
                } else {
                    err.textContent = data.error || '登录失败';
                    err.style.display = 'block';
                    btn.textContent = '登录';
                    btn.disabled = false;
                }
            })
            .catch(function() {
                err.textContent = '网络错误，请重试';
                err.style.display = 'block';
                btn.textContent = '登录';
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
