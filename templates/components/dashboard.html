<!-- 学习数据看板组件 -->
<style>
    .dashboard-section {
        margin-bottom: 40px;
    }

    .dashboard-title {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* === 统计卡片行 === */
    .dashboard-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 28px;
    }

    .dash-stat-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 24px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .dash-stat-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, #4FC3F7, #00BFA5);
        opacity: 0.6;
    }

    .dash-stat-card:hover {
        border-color: rgba(79, 195, 247, 0.3);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        transform: translateY(-1px);
    }

    .dash-stat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }

    .dash-stat-label {
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.6);
        font-weight: 500;
    }

    .dash-stat-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        flex-shrink: 0;
    }

    .dash-stat-icon.time { background: rgba(79, 195, 247, 0.12); }
    .dash-stat-icon.count { background: rgba(0, 191, 165, 0.12); }
    .dash-stat-icon.streak { background: rgba(255, 183, 77, 0.12); }

    .dash-stat-value {
        font-size: 2rem;
        font-weight: 700;
        color: #4FC3F7;
        line-height: 1.2;
        margin-bottom: 4px;
    }

    .dash-stat-value .unit {
        font-size: 0.9rem;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.5);
        margin-left: 4px;
    }

    .dash-stat-sub {
        font-size: 0.78rem;
        color: rgba(255, 255, 255, 0.35);
    }

    /* === 图表区域 === */
    .dashboard-charts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 28px;
    }

    .dash-chart-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 24px;
        position: relative;
    }

    .dash-chart-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .dash-chart-title .badge {
        font-size: 0.65rem;
        padding: 2px 8px;
        border-radius: 10px;
        background: rgba(0, 191, 165, 0.15);
        color: #00BFA5;
        font-weight: 500;
    }

    .dash-chart-canvas-wrapper {
        position: relative;
        width: 100%;
        height: 220px;
    }

    .dash-chart-canvas-wrapper canvas {
        width: 100% !important;
        height: 100% !important;
    }

    /* === 徽章行 === */
    .dashboard-badges {
        display: flex;
        gap: 16px;
        overflow-x: auto;
        padding-bottom: 4px;
    }

    .dashboard-badges::-webkit-scrollbar {
        height: 4px;
    }

    .dashboard-badges::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
    }

    .dash-badge-item {
        display: flex;
        align-items: center;
        gap: 14px;
        background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
        border: 1px solid rgba(255, 215, 0, 0.25);
        border-radius: 12px;
        padding: 14px 20px;
        min-width: 200px;
        flex-shrink: 0;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .dash-badge-item:hover {
        border-color: rgba(255, 215, 0, 0.5);
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.08);
    }

    .dash-badge-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        flex-shrink: 0;
    }

    .dash-badge-info {
        flex: 1;
        min-width: 0;
    }

    .dash-badge-name {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 2px;
    }

    .dash-badge-desc {
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.45);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .dash-badge-rarity {
        font-size: 0.6rem;
        padding: 2px 6px;
        border-radius: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .dash-badge-rarity.common { background: rgba(148, 163, 184, 0.15); color: #94A3B8; }
    .dash-badge-rarity.rare { background: rgba(99, 102, 241, 0.15); color: #818CF8; }
    .dash-badge-rarity.epic { background: rgba(139, 92, 246, 0.15); color: #A78BFA; }
    .dash-badge-rarity.legendary { background: rgba(255, 215, 0, 0.15); color: #FFD700; }

    .dash-badge-empty {
        padding: 20px;
        text-align: center;
        color: rgba(255, 255, 255, 0.35);
        font-size: 0.85rem;
    }

    /* === 空状态 === */
    .dashboard-empty {
        text-align: center;
        padding: 48px 24px;
        background: var(--bg-card);
        border: 1px dashed var(--border-color);
        border-radius: 16px;
    }

    .dashboard-empty-icon {
        font-size: 3rem;
        margin-bottom: 16px;
        opacity: 0.5;
    }

    .dashboard-empty-text {
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.5);
        margin-bottom: 20px;
    }

    .dashboard-empty .btn-primary {
        display: inline-block;
        background: var(--accent-blue);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 28px;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.2s ease;
    }

    .dashboard-empty .btn-primary:hover {
        background: #2563EB;
        box-shadow: 0 0 16px rgba(59, 130, 246, 0.4);
    }

    /* === Loading 骨架屏 === */
    .dashboard-loading {
        display: grid;
        gap: 20px;
    }

    .dash-skeleton {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 24px;
        animation: dashPulse 1.5s ease-in-out infinite;
    }

    .dash-skeleton-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .dash-skeleton-block {
        height: 100px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 10px;
    }

    .dash-skeleton-chart {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .dash-skeleton-chart-item {
        height: 200px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 10px;
    }

    @keyframes dashPulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.3; }
    }

    /* === 响应式 === */
    @media (max-width: 900px) {
        .dashboard-stats {
            grid-template-columns: repeat(3, 1fr);
        }
        .dashboard-charts {
            grid-template-columns: 1fr;
        }
    }

    @media (max-width: 600px) {
        .dashboard-stats {
            grid-template-columns: 1fr;
        }
        .dash-stat-value {
            font-size: 1.6rem;
        }
    }
</style>

<section class="dashboard-section" id="dashboardSection">
    <h2 class="dashboard-title">📊 学习数据看板</h2>

    <!-- Loading 状态 -->
    <div class="dashboard-loading" id="dashboardLoading">
        <div class="dash-skeleton dash-skeleton-row">
            <div class="dash-skeleton-block"></div>
            <div class="dash-skeleton-block"></div>
            <div class="dash-skeleton-block"></div>
        </div>
        <div class="dash-skeleton dash-skeleton-chart">
            <div class="dash-skeleton-chart-item"></div>
            <div class="dash-skeleton-chart-item"></div>
        </div>
    </div>

    <!-- 数据内容（默认隐藏） -->
    <div id="dashboardContent" style="display:none;">
        <!-- 统计卡片 -->
        <div class="dashboard-stats" id="dashboardStats">
            <div class="dash-stat-card">
                <div class="dash-stat-header">
                    <span class="dash-stat-label">累计练习时长</span>
                    <span class="dash-stat-icon time">⏱️</span>
                </div>
                <div class="dash-stat-value" id="statDuration">0 <span class="unit">分钟</span></div>
                <div class="dash-stat-sub">持续进步中</div>
            </div>
            <div class="dash-stat-card">
                <div class="dash-stat-header">
                    <span class="dash-stat-label">完成模拟次数</span>
                    <span class="dash-stat-icon count">📝</span>
                </div>
                <div class="dash-stat-value" id="statCount">0 <span class="unit">次</span></div>
                <div class="dash-stat-sub">累计完成练习</div>
            </div>
            <div class="dash-stat-card">
                <div class="dash-stat-header">
                    <span class="dash-stat-label">连续练习</span>
                    <span class="dash-stat-icon streak">🔥</span>
                </div>
                <div class="dash-stat-value" id="statStreak">0 <span class="unit">天</span></div>
                <div class="dash-stat-sub">坚持就是胜利</div>
            </div>
        </div>

        <!-- 图表区 -->
        <div class="dashboard-charts">
            <div class="dash-chart-card">
                <div class="dash-chart-title">🎯 能力雷达图 <span class="badge">近 10 次</span></div>
                <div class="dash-chart-canvas-wrapper">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>
            <div class="dash-chart-card">
                <div class="dash-chart-title">📈 得分趋势 <span class="badge">近 7 次</span></div>
                <div class="dash-chart-canvas-wrapper">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 徽章 -->
        <div class="dash-chart-card">
            <div class="dash-chart-title">🏆 最新徽章</div>
            <div class="dashboard-badges" id="badgeList"></div>
        </div>
    </div>

    <!-- 空状态 -->
    <div class="dashboard-empty" id="dashboardEmpty" style="display:none;">
        <div class="dashboard-empty-icon">🚀</div>
        <div class="dashboard-empty-text">还没有练习数据，开始你的第一次模拟面试吧！</div>
        <a href="#scenarios-section" class="btn-primary" onclick="document.querySelector('.scenarios-grid')?.scrollIntoView({behavior:'smooth'})">开始练习</a>
    </div>
</section>
