<!-- 学习数据看板组件 -->
<style>
    .dashboard-section {
        margin-bottom: 60px;
    }

    /* === 欢迎区域 === */
    .welcome-header {
        margin-bottom: 36px;
    }

    .welcome-title {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.03em;
        margin-bottom: 8px;
    }

    .welcome-sub {
        font-size: 1rem;
        color: var(--text-secondary);
        font-weight: 400;
    }

    .welcome-status {
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-top: 8px;
    }

    /* === 统计卡片行 === */
    .dashboard-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 32px;
    }

    .dash-stat-card {
        background: var(--bg-card);
        border: none;
        border-radius: var(--radius-lg);
        padding: 32px;
        box-shadow: var(--shadow-sm);
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dash-stat-card:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-2px);
    }

    .dash-stat-number {
        font-size: 3.5rem;
        font-weight: 800;
        color: var(--accent-blue);
        line-height: 1;
        margin-bottom: 12px;
        letter-spacing: -0.03em;
    }

    .dash-stat-number .unit {
        font-size: 1rem;
        font-weight: 500;
        color: var(--text-muted);
        margin-left: 4px;
    }

    .dash-stat-label {
        font-size: 0.85rem;
        color: var(--text-secondary);
        font-weight: 500;
    }

    .dash-stat-card .icon-row {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 12px;
    }

    .dash-stat-icon {
        width: 32px;
        height: 32px;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: var(--accent-blue);
        background: rgba(125, 211, 252, 0.06);
    }

    /* === 图表区域 === */
    .dashboard-charts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 32px;
    }

    .dash-chart-card {
        background: var(--bg-card);
        border: none;
        border-radius: var(--radius-lg);
        padding: 28px;
        box-shadow: var(--shadow-sm);
    }

    .dash-chart-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .dash-chart-title .badge {
        font-size: 0.65rem;
        padding: 3px 10px;
        border-radius: 20px;
        background: rgba(125, 211, 252, 0.1);
        color: var(--accent-blue);
        font-weight: 500;
    }

    .dash-chart-canvas-wrapper {
        position: relative;
        width: 100%;
        height: 220px;
    }

    .dash-chart-canvas-wrapper canvas {
        width: 100% !important;
        height: 100% !important;
    }

    /* 图表空状态 — 高级感 */
    .chart-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 220px;
        text-align: center;
        color: var(--text-muted);
    }

    .chart-empty-icon {
        font-size: 2rem;
        margin-bottom: 12px;
        opacity: 0.3;
        color: var(--accent-blue);
    }

    .chart-empty-title {
        font-size: 0.9rem;
        color: var(--text-secondary);
        margin-bottom: 4px;
    }

    .chart-empty-desc {
        font-size: 0.78rem;
        color: var(--text-muted);
    }

    /* === 徽章行 === */
    .dashboard-badges {
        display: flex;
        gap: 16px;
        overflow-x: auto;
        padding-bottom: 4px;
    }

    .dashboard-badges::-webkit-scrollbar {
        height: 4px;
    }

    .dashboard-badges::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.1);
        border-radius: 4px;
    }

    .dash-badge-item {
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--bg-card);
        border: 1px solid rgba(125, 211, 252, 0.08);
        border-radius: var(--radius-sm);
        padding: 14px 20px;
        min-width: 200px;
        flex-shrink: 0;
        transition: all 0.2s ease;
        cursor: pointer;
    }

    .dash-badge-item:hover {
        border-color: rgba(125, 211, 252, 0.2);
        box-shadow: var(--shadow-glow);
    }

    .dash-badge-icon {
        width: 44px;
        height: 44px;
        border-radius: var(--radius-sm);
        background: rgba(125, 211, 252, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        flex-shrink: 0;
        color: var(--accent-blue);
    }

    .dash-badge-info {
        flex: 1;
        min-width: 0;
    }

    .dash-badge-name {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 2px;
    }

    .dash-badge-desc {
        font-size: 0.75rem;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .dash-badge-rarity {
        font-size: 0.6rem;
        padding: 2px 8px;
        border-radius: 20px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .dash-badge-rarity.common { background: rgba(148, 163, 184, 0.1); color: #94A3B8; }
    .dash-badge-rarity.rare { background: rgba(125, 211, 252, 0.1); color: var(--accent-blue); }
    .dash-badge-rarity.epic { background: rgba(56, 189, 248, 0.1); color: var(--accent-deep); }
    .dash-badge-rarity.legendary { background: rgba(251, 191, 36, 0.1); color: var(--accent-amber); }

    .dash-badge-empty {
        padding: 20px;
        text-align: center;
        color: var(--text-muted);
        font-size: 0.85rem;
    }

    /* === 全局空状态 === */
    .dashboard-empty {
        text-align: center;
        padding: 72px 24px;
        background: var(--bg-card);
        border: none;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
    }

    .dashboard-empty-icon {
        font-size: 2.5rem;
        margin-bottom: 16px;
        opacity: 0.25;
        color: var(--accent-blue);
    }

    .dashboard-empty-title {
        font-size: 1.1rem;
        color: var(--text-secondary);
        margin-bottom: 6px;
        font-weight: 500;
    }

    .dashboard-empty-desc {
        font-size: 0.9rem;
        color: var(--text-muted);
        margin-bottom: 24px;
    }

    .dashboard-empty .btn-primary {
        display: inline-block;
        background: var(--accent-gradient);
        color: #fff;
        border: none;
        border-radius: var(--radius-sm);
        padding: 12px 28px;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.2s ease;
    }

    .dashboard-empty .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 16px rgba(125, 211, 252, 0.15);
    }

    /* === Loading 骨架屏 === */
    .dashboard-loading {
        display: grid;
        gap: 20px;
    }

    .dash-skeleton {
        background: var(--bg-card);
        border: none;
        border-radius: var(--radius-lg);
        padding: 24px;
        animation: dashPulse 1.5s ease-in-out infinite;
        box-shadow: var(--shadow-sm);
    }

    .dash-skeleton-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .dash-skeleton-block {
        height: 140px;
        background: rgba(148, 163, 184, 0.03);
        border-radius: var(--radius-sm);
    }

    .dash-skeleton-chart {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .dash-skeleton-chart-item {
        height: 200px;
        background: rgba(148, 163, 184, 0.03);
        border-radius: var(--radius-sm);
    }

    @keyframes dashPulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.3; }
    }

    /* === 响应式 === */
    @media (max-width: 900px) {
        .dashboard-stats {
            grid-template-columns: repeat(3, 1fr);
        }
        .dashboard-charts {
            grid-template-columns: 1fr;
        }
    }

    @media (max-width: 600px) {
        .dashboard-stats {
            grid-template-columns: 1fr;
        }
        .dash-stat-number {
            font-size: 2.5rem;
        }
    }
</style>

<section class="dashboard-section" id="dashboardSection">
    <!-- 欢迎区域 — 始终显示 -->
    <div class="welcome-header">
        <div class="welcome-title">欢迎回来</div>
        <div class="welcome-sub">继续你的模拟训练</div>
        <div class="welcome-status">今天距离你的目标更近一步。</div>
    </div>

    <!-- Loading 状态 -->
    <div class="dashboard-loading" id="dashboardLoading">
        <div class="dash-skeleton dash-skeleton-row">
            <div class="dash-skeleton-block"></div>
            <div class="dash-skeleton-block"></div>
            <div class="dash-skeleton-block"></div>
        </div>
        <div class="dash-skeleton dash-skeleton-chart">
            <div class="dash-skeleton-chart-item"></div>
            <div class="dash-skeleton-chart-item"></div>
        </div>
    </div>

    <!-- 数据内容（默认隐藏） -->
    <div id="dashboardContent" style="display:none;">
        <!-- 统计卡片 — 数字优先 -->
        <div class="dashboard-stats" id="dashboardStats">
            <div class="dash-stat-card">
                <div class="icon-row">
                    <span class="dash-stat-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </span>
                </div>
                <div class="dash-stat-number" id="statDuration">0 <span class="unit">分钟</span></div>
                <div class="dash-stat-label">累计练习时长</div>
            </div>
            <div class="dash-stat-card">
                <div class="icon-row">
                    <span class="dash-stat-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                        </svg>
                    </span>
                </div>
                <div class="dash-stat-number" id="statCount">0 <span class="unit">次</span></div>
                <div class="dash-stat-label">模拟完成次数</div>
            </div>
            <div class="dash-stat-card">
                <div class="icon-row">
                    <span class="dash-stat-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                        </svg>
                    </span>
                </div>
                <div class="dash-stat-number" id="statStreak">0 <span class="unit">天</span></div>
                <div class="dash-stat-label">连续练习</div>
            </div>
        </div>

        <!-- 图表区 -->
        <div class="dashboard-charts">
            <div class="dash-chart-card">
                <div class="dash-chart-title">能力雷达图 <span class="badge">近 10 次</span></div>
                <div class="dash-chart-canvas-wrapper">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>
            <div class="dash-chart-card">
                <div class="dash-chart-title">得分趋势 <span class="badge">近 7 次</span></div>
                <div class="dash-chart-canvas-wrapper">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 徽章 -->
        <div class="dash-chart-card">
            <div class="dash-chart-title">最新徽章</div>
            <div class="dashboard-badges" id="badgeList"></div>
        </div>
    </div>

    <!-- 空状态 — 高级感 -->
    <div class="dashboard-empty" id="dashboardEmpty" style="display:none;">
        <div class="dashboard-empty-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
        </div>
        <div class="dashboard-empty-title">完成第一次模拟后</div>
        <div class="dashboard-empty-desc">这里将展示你的成长轨迹和能力分析</div>
        <a href="#scenarios-section" class="btn-primary" onclick="document.querySelector('.scenarios-grid')?.scrollIntoView({behavior:'smooth'})">开始第一次模拟</a>
    </div>
</section>
