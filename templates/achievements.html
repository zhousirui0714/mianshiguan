<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成就徽章 - 百工</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1117;
            --bg-card: #161822;
            --bg-card-hover: #1c1f2e;
            --border: #1e2030;
            --text: #e4e6f0;
            --text-secondary: #8b8fa8;
            --text-muted: #5a5d78;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --gold: #f59e0b;
            --purple: #a855f7;
            --blue: #3b82f6;
            --green: #22c55e;
            --red: #ef4444;
            --gray: #6b7280;
            --sidebar-width: 240px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            -webkit-font-smoothing: antialiased;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            position: fixed;
            top: 0; left: 0; bottom: 0;
            display: flex; flex-direction: column;
            z-index: 50;
        }
        .sidebar-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
        }
        .sidebar-logo { font-size: 1.5rem; }
        .sidebar-brand { font-size: 1.05rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
        .sidebar-brand span { color: var(--accent); }
        .sidebar-nav { flex: 1; padding: 12px; overflow-y: auto; }
        .sidebar-nav a {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; border-radius: 10px;
            color: var(--text-secondary); text-decoration: none;
            font-size: 0.9rem; font-weight: 500;
            transition: all 0.15s;
            margin-bottom: 2px;
        }
        .sidebar-nav a:hover { background: rgba(99,102,241,0.08); color: var(--text); }
        .sidebar-nav a.active { background: rgba(99,102,241,0.12); color: var(--accent-light); }
        .sidebar-nav a svg { flex-shrink: 0; }

        /* Main */
        .main { flex: 1; margin-left: var(--sidebar-width); }

        /* Top bar */
        .topbar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 40;
        }
        .topbar-title { font-size: 1.15rem; font-weight: 600; }
        .topbar-right { display: flex; align-items: center; gap: 16px; }

        /* Content */
        .content { padding: 32px; max-width: 1000px; }

        /* Hero stats */
        .stats-hero {
            display: flex; gap: 20px; margin-bottom: 32px;
        }
        .stat-hero-card {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            display: flex; align-items: center; gap: 16px;
        }
        .stat-hero-icon {
            width: 52px; height: 52px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
        }
        .stat-hero-icon.unlocked { background: rgba(99,102,241,0.12); }
        .stat-hero-icon.total { background: rgba(245,158,11,0.1); }
        .stat-hero-icon.progress { background: rgba(34,197,94,0.1); }
        .stat-hero-value { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
        .stat-hero-label { font-size: 0.85rem; color: var(--text-secondary); margin-top: 2px; }

        /* Filters */
        .filters {
            display: flex; gap: 8px; margin-bottom: 28px;
        }
        .filter-pill {
            padding: 8px 20px; border-radius: 20px;
            font-size: 0.85rem; font-weight: 500; cursor: pointer;
            border: 1px solid var(--border);
            background: transparent; color: var(--text-secondary);
            transition: all 0.15s;
        }
        .filter-pill:hover { border-color: var(--accent); color: var(--text); }
        .filter-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

        /* Category */
        .category-section { margin-bottom: 28px; }
        .category-header {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 16px;
        }
        .category-icon { font-size: 1.2rem; }
        .category-name { font-size: 1rem; font-weight: 600; }
        .category-count { font-size: 0.8rem; color: var(--text-muted); }

        /* Badge grid */
        .badges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 14px;
        }

        .badge-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 16px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .badge-card:hover { border-color: var(--accent); transform: translateY(-3px); background: var(--bg-card-hover); }
        .badge-card.locked { opacity: 0.35; filter: grayscale(1); }
        .badge-card.locked:hover { opacity: 0.5; }

        .badge-card.new-badge::after {
            content: 'NEW';
            position: absolute; top: 10px; right: 10px;
            background: var(--accent); color: #fff;
            font-size: 0.6rem; font-weight: 700; padding: 3px 7px;
            border-radius: 6px; letter-spacing: 0.05em;
            animation: glow 2s infinite;
        }
        @keyframes glow {
            0%,100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.4); }
            50% { box-shadow: 0 0 0 6px rgba(99,102,241,0); }
        }

        .badge-icon-wrap {
            width: 64px; height: 64px; margin: 0 auto 14px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
        }
        .badge-card:not(.locked) .badge-icon-wrap { background: rgba(99,102,241,0.08); }
        .badge-card.locked .badge-icon-wrap { background: rgba(107,114,128,0.08); }

        .badge-name { font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
        .badge-desc { font-size: 0.75rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .badge-rarity-tag {
            display: inline-block; font-size: 0.7rem; font-weight: 600;
            padding: 2px 10px; border-radius: 10px; letter-spacing: 0.02em;
        }
        .rarity-common { background: rgba(107,114,128,0.15); color: var(--gray); }
        .rarity-rare { background: rgba(59,130,246,0.15); color: var(--blue); }
        .rarity-epic { background: rgba(168,85,247,0.15); color: var(--purple); }
        .rarity-legendary { background: rgba(245,158,11,0.15); color: var(--gold); }

        .badge-card.locked .badge-rarity-tag { background: rgba(107,114,128,0.08); color: var(--text-muted); }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; animation: fadeIn 0.2s;
        }
        .modal-content {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 20px; width: 380px; max-width: 90vw;
            overflow: hidden; animation: slideUp 0.25s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .modal-hero {
            padding: 32px 24px; text-align: center;
            background: linear-gradient(135deg, rgba(99,102,241,0.06), rgba(168,85,247,0.06));
        }
        .modal-icon { font-size: 4rem; margin-bottom: 12px; }
        .modal-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
        .modal-body { padding: 24px; }
        .modal-desc { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 18px; }
        .modal-condition-box {
            background: rgba(255,255,255,0.03); border-radius: 12px; padding: 16px;
            border: 1px solid var(--border);
        }
        .modal-condition-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
        .modal-condition-text { font-size: 0.9rem; color: var(--text); }
        .modal-status {
            margin-top: 16px; padding: 12px; border-radius: 10px;
            text-align: center; font-size: 0.9rem; font-weight: 500;
        }
        .modal-status.unlocked { background: rgba(34,197,94,0.08); color: var(--green); }
        .modal-status.locked { background: rgba(239,68,68,0.08); color: var(--red); }
        .modal-footer { padding: 0 24px 20px; text-align: center; }
        .btn-close {
            padding: 10px 32px; border-radius: 10px;
            background: var(--accent); color: #fff; border: none;
            font-size: 0.9rem; font-weight: 500; cursor: pointer;
            transition: background 0.15s;
        }
        .btn-close:hover { background: var(--accent-light); }

        /* Empty */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-icon { font-size: 3rem; margin-bottom: 16px; }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { margin-left: 0; }
            .stats-hero { flex-direction: column; }
            .badges-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .content { padding: 20px; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo">🏗️</span>
            <span class="sidebar-brand">百<span>工</span></span>
        </div>
        <nav class="sidebar-nav">
            <a href="/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12l9-9 9 9"/><path d="M5 10v9a1 1 0 001 1h3v-5a1 1 0 011-1h2a1 1 0 011 1v5h3a1 1 0 001-1v-9"/></svg>首页</a>
            <a href="/scenarios"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/></svg>场景中心</a>
            <a href="/question-bank"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>真题题库</a>
            <a href="/growth"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>成长中心</a>
            <a href="/badges" class="active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>成就徽章</a>
        </nav>
    </aside>

    <main class="main">
        <header class="topbar">
            <h1 class="topbar-title">🏆 成就徽章</h1>
            <div class="topbar-right">
                <span style="font-size:0.85rem;color:var(--text-secondary);" id="headerUser"></span>
            </div>
        </header>

        <div class="content">
            <!-- Stats -->
            <div class="stats-hero">
                <div class="stat-hero-card">
                    <div class="stat-hero-icon unlocked">🏆</div>
                    <div>
                        <div class="stat-hero-value" id="unlockedCount">0</div>
                        <div class="stat-hero-label">已解锁徽章</div>
                    </div>
                </div>
                <div class="stat-hero-card">
                    <div class="stat-hero-icon total">📋</div>
                    <div>
                        <div class="stat-hero-value" id="totalCount">0</div>
                        <div class="stat-hero-label">全部徽章</div>
                    </div>
                </div>
                <div class="stat-hero-card">
                    <div class="stat-hero-icon progress">📊</div>
                    <div>
                        <div class="stat-hero-value" id="completionPercent">0%</div>
                        <div class="stat-hero-label">完成进度</div>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="filters">
                <button class="filter-pill active" data-filter="all" onclick="setFilter('all')">全部</button>
                <button class="filter-pill" data-filter="unlocked" onclick="setFilter('unlocked')">✅ 已解锁</button>
                <button class="filter-pill" data-filter="locked" onclick="setFilter('locked')">🔒 未解锁</button>
            </div>

            <!-- Badges -->
            <div id="badgesContainer"></div>
        </div>
    </main>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal" style="display:none;" onclick="if(event.target===this)closeModal()">
        <div class="modal-content">
            <div class="modal-hero">
                <div class="modal-icon" id="modalIcon">🏆</div>
                <div class="modal-name" id="modalName"></div>
                <span class="badge-rarity-tag" id="modalRarity"></span>
            </div>
            <div class="modal-body">
                <div class="modal-desc" id="modalDesc"></div>
                <div class="modal-condition-box">
                    <div class="modal-condition-label">📋 解锁条件</div>
                    <div class="modal-condition-text" id="modalCondition"></div>
                </div>
                <div class="modal-status" id="modalStatus"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-close" onclick="closeModal()">知道了</button>
            </div>
        </div>
    </div>

    <script>
        const USER_ID = '{{ g.current_user.id if g.current_user else "anonymous" }}';

        // Show current user
        fetch('/api/auth/me').then(r => r.json()).then(d => {
            if (d.logged_in) {
                document.getElementById('headerUser').textContent = d.user.username;
            }
        });

        const categories = {
            'newbie': { name: '新手入门', icon: '🌟' },
            'persistence': { name: '坚持打卡', icon: '🔥' },
            'scenario': { name: '场景挑战', icon: '🎯' },
            'special': { name: '特殊成就', icon: '💎' }
        };

        const rarityLabels = { 'common': '普通', 'rare': '稀有', 'epic': '史诗', 'legendary': '传说' };

        let allBadges = [], userBadges = {}, currentFilter = 'all';

        async function init() {
            await Promise.all([loadBadges(), loadUserBadges()]);
        }

        async function loadBadges() {
            const r = await fetch('/api/badges');
            const d = await r.json();
            if (d.success) { allBadges = d.data; render(); }
        }

        async function loadUserBadges() {
            const r = await fetch(`/api/user/${USER_ID}/badges`);
            const d = await r.json();
            if (d.success) {
                userBadges = {};
                d.data.forEach(b => { userBadges[b.id] = b; });
                render();
            }
        }

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-filter="${f}"]`).classList.add('active');
            render();
        }

        function render() {
            const unlocked = Object.keys(userBadges).length;
            const total = allBadges.length;
            const pct = total > 0 ? Math.round(unlocked / total * 100) : 0;

            document.getElementById('unlockedCount').textContent = unlocked;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('completionPercent').textContent = pct + '%';

            const grouped = {};
            allBadges.forEach(b => {
                if (!grouped[b.category]) grouped[b.category] = [];
                grouped[b.category].push(b);
            });

            let html = '';
            for (const [cat, badges] of Object.entries(grouped)) {
                let filtered = badges;
                if (currentFilter === 'unlocked') filtered = badges.filter(b => userBadges[b.id]);
                else if (currentFilter === 'locked') filtered = badges.filter(b => !userBadges[b.id]);
                if (!filtered.length) continue;

                const catUnlocked = badges.filter(b => userBadges[b.id]).length;
                html += `<div class="category-section">
                    <div class="category-header">
                        <span class="category-icon">${categories[cat]?.icon || '📌'}</span>
                        <span class="category-name">${categories[cat]?.name || cat}</span>
                        <span class="category-count">${catUnlocked}/${badges.length}</span>
                    </div>
                    <div class="badges-grid">
                        ${filtered.map(b => renderBadge(b)).join('')}
                    </div>
                </div>`;
            }

            document.getElementById('badgesContainer').innerHTML = html || `
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <div>${currentFilter === 'unlocked' ? '还没有解锁任何徽章' : currentFilter === 'locked' ? '🎉 全部解锁！' : '暂无徽章数据'}</div>
                </div>`;
        }

        function renderBadge(badge) {
            const isUnlocked = !!userBadges[badge.id];
            const isNew = isUnlocked && userBadges[badge.id].is_new;
            return `
                <div class="badge-card ${isUnlocked ? '' : 'locked'} ${isNew ? 'new-badge' : ''}"
                     onclick="openModal('${badge.id}')">
                    <div class="badge-icon-wrap">${badge.icon}</div>
                    <div class="badge-name">${badge.name}</div>
                    <div class="badge-desc">${badge.description}</div>
                    <span class="badge-rarity-tag rarity-${badge.rarity}">${rarityLabels[badge.rarity]}</span>
                </div>`;
        }

        function openModal(badgeId) {
            const badge = allBadges.find(b => b.id === badgeId);
            if (!badge) return;
            const isUnlocked = !!userBadges[badgeId];

            document.getElementById('modalIcon').textContent = badge.icon;
            document.getElementById('modalName').textContent = badge.name;
            document.getElementById('modalRarity').textContent = rarityLabels[badge.rarity];
            document.getElementById('modalRarity').className = `badge-rarity-tag rarity-${badge.rarity}`;
            document.getElementById('modalDesc').textContent = badge.description;
            document.getElementById('modalCondition').textContent = getConditionText(badge.unlock_condition);

            const status = document.getElementById('modalStatus');
            if (isUnlocked) {
                status.textContent = '✅ 已解锁 · ' + formatDate(userBadges[badgeId].unlocked_at);
                status.className = 'modal-status unlocked';
            } else {
                status.textContent = '🔒 尚未解锁，继续加油！';
                status.className = 'modal-status locked';
            }

            if (isUnlocked && userBadges[badgeId].is_new) {
                fetch(`/api/badge/${badgeId}/mark-viewed`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: USER_ID })
                });
                userBadges[badgeId].is_new = false;
                render();
            }

            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function getConditionText(c) {
            const map = {
                'first_practice': '完成第一次模拟练习',
                'first_high_score': `首次练习得分 ≥ ${c.threshold} 分`,
                'total_practices': `累计完成 ${c.count} 次练习`,
                'streak': `连续 ${c.days} 天登录练习`,
                'scenario_high_score': `${sceneName(c.scenario)}场景得分 ≥ ${c.threshold} 分`,
                'scenario_practices': `${sceneName(c.scenario)}场景完成 ${c.count} 次练习`,
                'speed_score': `${c.duration} 秒内完成答题且得分 ≥ ${c.threshold} 分`,
                'all_scenarios': '所有场景各完成 1 次练习',
                'view_explanations': `查看 ${c.count} 道题目解析`,
                'improvement': `同一场景练习 ${c.scenario_count} 次后得分提升 ${c.improvement} 分`,
            };
            return map[c.type] || '完成特定成就';
        }

        function sceneName(id) {
            const m = { 'job_interview': '求职面试', 'teacher_cert': '教资面试', 'ielts_speaking': '雅思口语', 'civil_service': '公务员面试', 'graduate_school': '考研复试', 'mba_interview': 'MBA面试' };
            return m[id] || id;
        }

        function formatDate(s) {
            if (!s) return '';
            const d = new Date(s);
            return `${d.getMonth() + 1}月${d.getDate()}日`;
        }

        init();
    </script>
</body>
</html>
