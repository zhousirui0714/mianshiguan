<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成就徽章 — 百工</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --blue-50: #f0f7ff;
            --blue-100: #e0effe;
            --blue-200: #b9dffb;
            --blue-400: #60a5fa;
            --blue-500: #3b82f6;
            --blue-600: #2563eb;
            --blue-700: #1d4ed8;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-900: #111827;
            --max-w: 1200px;
        }

        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #fff;
            color: var(--gray-700);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: var(--max-w); margin: 0 auto; padding: 0 32px; }

        /* Nav */
        nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--gray-200);
        }
        nav .container {
            display: flex; align-items: center; justify-content: space-between;
            height: 64px;
        }
        .nav-logo {
            font-size: 20px; font-weight: 700; color: var(--gray-900);
            letter-spacing: -0.03em; display: flex; align-items: center; gap: 6px;
        }
        .nav-logo span { color: var(--blue-500); }
        .nav-links { display: flex; align-items: center; gap: 28px; list-style: none; }
        .nav-links a {
            font-size: 14px; font-weight: 500; color: var(--gray-500);
            transition: color 0.15s; text-decoration: none;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--gray-900); }
        .nav-avatar {
            display: flex; align-items: center; gap: 8px;
            font-size: 14px; font-weight: 500; color: var(--gray-600);
        }
        .nav-avatar-circle {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--blue-500); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600;
        }

        /* Page header */
        .page-hero { padding: 64px 0 48px; }
        .page-hero .container { max-width: var(--max-w); }
        .page-label {
            font-size: 13px; font-weight: 600; color: var(--blue-500);
            letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 8px;
        }
        .page-title {
            font-size: 36px; font-weight: 700; color: var(--gray-900);
            letter-spacing: -0.03em; line-height: 1.2; margin-bottom: 12px;
        }
        .page-sub {
            font-size: 16px; color: var(--gray-400); max-width: 500px;
        }

        /* Stats cards */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: var(--gray-50);
            border: 1px solid var(--gray-100);
            border-radius: 16px;
            padding: 24px;
            display: flex; align-items: center; gap: 16px;
            transition: border-color 0.15s;
        }
        .stat-card:hover { border-color: var(--gray-200); }
        .stat-icon {
            width: 48px; height: 48px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.35rem;
        }
        .stat-icon.blue { background: var(--blue-50); }
        .stat-icon.gray { background: var(--gray-100); }
        .stat-icon.green { background: #ecfdf5; }
        .stat-value { font-size: 1.6rem; font-weight: 700; color: var(--gray-900); letter-spacing: -0.02em; }
        .stat-label { font-size: 0.82rem; color: var(--gray-400); margin-top: 2px; }

        /* Filters */
        .filter-bar {
            display: flex; gap: 8px; margin-bottom: 36px;
            padding-bottom: 24px; border-bottom: 1px solid var(--gray-100);
        }
        .filter-btn {
            padding: 7px 18px; border-radius: 8px;
            font-size: 13px; font-weight: 500; cursor: pointer;
            border: 1px solid var(--gray-200);
            background: #fff; color: var(--gray-500);
            transition: all 0.15s;
        }
        .filter-btn:hover { border-color: var(--blue-400); color: var(--gray-700); }
        .filter-btn.active { background: var(--blue-500); border-color: var(--blue-500); color: #fff; }

        /* Category */
        .category-block { margin-bottom: 36px; }
        .category-head {
            display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
        }
        .category-head-icon { font-size: 1.1rem; }
        .category-head-name { font-size: 16px; font-weight: 600; color: var(--gray-900); }
        .category-head-count {
            font-size: 13px; color: var(--gray-400); font-weight: 400;
        }

        /* Badge grid */
        .badge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(172px, 1fr));
            gap: 14px;
        }

        .badge-card {
            background: #fff;
            border: 1px solid var(--gray-100);
            border-radius: 16px;
            padding: 22px 16px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .badge-card:hover {
            border-color: var(--blue-200);
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            transform: translateY(-2px);
        }
        .badge-card.locked {
            opacity: 0.45;
            filter: grayscale(1);
        }
        .badge-card.locked:hover { opacity: 0.6; border-color: var(--gray-200); box-shadow: none; transform: none; }

        .badge-card.new::after {
            content: 'NEW';
            position: absolute; top: 10px; right: 10px;
            background: var(--blue-500); color: #fff;
            font-size: 0.6rem; font-weight: 700; padding: 3px 7px;
            border-radius: 5px; letter-spacing: 0.04em;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.35); }
            50% { box-shadow: 0 0 0 8px rgba(59,130,246,0); }
        }

        .badge-icon-circle {
            width: 60px; height: 60px; margin: 0 auto 12px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
        }
        .badge-card:not(.locked) .badge-icon-circle { background: var(--blue-50); }
        .badge-card.locked .badge-icon-circle { background: var(--gray-100); }

        .badge-card-name { font-size: 0.9rem; font-weight: 600; color: var(--gray-900); margin-bottom: 4px; }
        .badge-card-desc {
            font-size: 0.73rem; color: var(--gray-400); line-height: 1.4;
            margin-bottom: 10px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .rarity-tag {
            display: inline-block; font-size: 0.68rem; font-weight: 600;
            padding: 2px 10px; border-radius: 10px;
        }
        .rarity-common  { background: var(--gray-100); color: var(--gray-500); }
        .rarity-rare    { background: var(--blue-50);  color: var(--blue-600); }
        .rarity-epic    { background: #f5f3ff;         color: #7c3aed; }
        .rarity-legendary { background: #fffbeb;       color: #d97706; }

        .badge-card.locked .rarity-tag { background: var(--gray-100); color: var(--gray-300); }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.35); backdrop-filter: blur(2px);
            display: flex; align-items: center; justify-content: center;
            z-index: 200; animation: fadeIn 0.2s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-box {
            background: #fff; border-radius: 20px; width: 380px; max-width: 90vw;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
            animation: slideUp 0.25s;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .modal-top {
            padding: 36px 24px 28px; text-align: center;
            background: var(--blue-50);
        }
        .modal-top-icon { font-size: 3.5rem; margin-bottom: 10px; }
        .modal-top-name { font-size: 1.15rem; font-weight: 700; color: var(--gray-900); margin-bottom: 8px; }

        .modal-body { padding: 24px; }
        .modal-body-desc { font-size: 0.9rem; color: var(--gray-500); line-height: 1.6; margin-bottom: 18px; }
        .modal-condition {
            background: var(--gray-50); border: 1px solid var(--gray-100);
            border-radius: 10px; padding: 14px 16px;
        }
        .modal-condition-label { font-size: 0.78rem; color: var(--gray-400); margin-bottom: 4px; }
        .modal-condition-text { font-size: 0.9rem; color: var(--gray-700); font-weight: 500; }

        .modal-status {
            margin-top: 16px; padding: 10px; border-radius: 10px;
            text-align: center; font-size: 0.88rem; font-weight: 500;
        }
        .modal-status.ok    { background: #ecfdf5; color: #059669; }
        .modal-status.no    { background: var(--gray-50); color: var(--gray-400); }

        .modal-footer { padding: 0 24px 20px; text-align: center; }
        .btn-primary {
            padding: 10px 36px; border-radius: 10px;
            background: var(--blue-500); color: #fff; border: none;
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.15s;
        }
        .btn-primary:hover { background: var(--blue-600); transform: translateY(-1px); }

        .empty-wrap { text-align: center; padding: 60px 20px; color: var(--gray-400); }
        .empty-wrap-icon { font-size: 2.5rem; margin-bottom: 12px; }

        hr { border: none; border-top: 1px solid var(--gray-100); }

        footer {
            border-top: 1px solid var(--gray-100);
            padding: 24px 0; margin-top: 48px;
            text-align: center; font-size: 13px; color: var(--gray-400);
        }
        footer a { color: var(--blue-500); }

        @media (max-width: 768px) {
            .container { padding: 0 20px; }
            .stats-row { grid-template-columns: 1fr; }
            .page-title { font-size: 28px; }
            .badge-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="/" class="nav-logo">🏗️ 百<span>工</span></a>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/scenarios">场景中心</a></li>
                <li><a href="/question-bank">真题题库</a></li>
                <li><a href="/growth">成长中心</a></li>
                <li><a href="/badges" class="active">成就徽章</a></li>
            </ul>
            <div class="nav-avatar" id="navUser">
                <div class="nav-avatar-circle" id="navAvatar">?</div>
                <span id="navName">加载中</span>
            </div>
        </div>
    </nav>

    <header class="page-hero">
        <div class="container">
            <div class="page-label">Achievements</div>
            <h1 class="page-title">成就徽章</h1>
            <p class="page-sub">每次练习都在累积经验，解锁属于你的荣誉勋章。</p>
        </div>
    </header>

    <div class="container">
        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon blue">🏆</div>
                <div>
                    <div class="stat-value" id="unlockedCount">0</div>
                    <div class="stat-label">已解锁徽章</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon gray">📋</div>
                <div>
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">全部徽章</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">📊</div>
                <div>
                    <div class="stat-value" id="completionPercent">0%</div>
                    <div class="stat-label">完成进度</div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
            <button class="filter-btn" data-filter="unlocked" onclick="setFilter('unlocked')">✅ 已解锁</button>
            <button class="filter-btn" data-filter="locked" onclick="setFilter('locked')">🔒 未解锁</button>
        </div>

        <!-- Badges -->
        <div id="badgesContainer"></div>
    </div>

    <footer>
        <div class="container">
            <a href="/" class="nav-logo" style="justify-content:center;">🏗️ 百<span>工</span></a>
            <p style="margin-top:8px;">AI 模拟面试平台</p>
        </div>
    </footer>

    <!-- Modal -->
    <div class="modal-overlay" id="detailModal" style="display:none;" onclick="if(event.target===this)closeModal()">
        <div class="modal-box">
            <div class="modal-top">
                <div class="modal-top-icon" id="modalIcon">🏆</div>
                <div class="modal-top-name" id="modalName"></div>
                <span class="rarity-tag" id="modalRarity"></span>
            </div>
            <div class="modal-body">
                <div class="modal-body-desc" id="modalDesc"></div>
                <div class="modal-condition">
                    <div class="modal-condition-label">解锁条件</div>
                    <div class="modal-condition-text" id="modalCondition"></div>
                </div>
                <div class="modal-status" id="modalStatus"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" onclick="closeModal()">知道了</button>
            </div>
        </div>
    </div>

    <script>
        const USER_ID = '{{ g.current_user.id if g.current_user else "anonymous" }}';

        // Load user info for nav
        fetch('/api/auth/me').then(r => r.json()).then(d => {
            if (d.logged_in) {
                document.getElementById('navName').textContent = d.user.username;
                document.getElementById('navAvatar').textContent = d.user.username.charAt(0).toUpperCase();
            }
        });

        const categories = {
            'newbie': { name: '新手入门', icon: '🌟' },
            'persistence': { name: '坚持打卡', icon: '🔥' },
            'scenario': { name: '场景挑战', icon: '🎯' },
            'special': { name: '特殊成就', icon: '💎' }
        };
        const rarityLabels = { 'common': '普通', 'rare': '稀有', 'epic': '史诗', 'legendary': '传说' };

        let allBadges = [], userBadges = {}, currentFilter = 'all';

        async function init() {
            await Promise.all([loadBadges(), loadUserBadges()]);
        }

        async function loadBadges() {
            const r = await fetch('/api/badges');
            const d = await r.json();
            if (d.success) { allBadges = d.data; render(); }
        }
        async function loadUserBadges() {
            const r = await fetch(`/api/user/${USER_ID}/badges`);
            const d = await r.json();
            if (d.success) {
                userBadges = {};
                d.data.forEach(b => { userBadges[b.id] = b; });
                render();
            }
        }

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-filter="${f}"]`).classList.add('active');
            render();
        }

        function render() {
            const unlocked = Object.keys(userBadges).length;
            const total = allBadges.length;
            document.getElementById('unlockedCount').textContent = unlocked;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('completionPercent').textContent = total > 0 ? Math.round(unlocked/total*100) + '%' : '0%';

            const grouped = {};
            allBadges.forEach(b => {
                if (!grouped[b.category]) grouped[b.category] = [];
                grouped[b.category].push(b);
            });

            let html = '';
            for (const [cat, badges] of Object.entries(grouped)) {
                let filtered = badges;
                if (currentFilter === 'unlocked') filtered = badges.filter(b => userBadges[b.id]);
                else if (currentFilter === 'locked') filtered = badges.filter(b => !userBadges[b.id]);
                if (!filtered.length) continue;

                const n = badges.filter(b => userBadges[b.id]).length;
                html += `<div class="category-block">
                    <div class="category-head">
                        <span class="category-head-icon">${categories[cat]?.icon || '📌'}</span>
                        <span class="category-head-name">${categories[cat]?.name || cat}</span>
                        <span class="category-head-count">${n}/${badges.length}</span>
                    </div>
                    <div class="badge-grid">
                        ${filtered.map(b => renderCard(b)).join('')}
                    </div>
                </div>`;
            }
            document.getElementById('badgesContainer').innerHTML = html || `<div class="empty-wrap"><div class="empty-wrap-icon">📭</div>暂无徽章</div>`;
        }

        function renderCard(b) {
            const ok = !!userBadges[b.id];
            const isNew = ok && userBadges[b.id].is_new;
            return `<div class="badge-card ${ok ? '' : 'locked'} ${isNew ? 'new' : ''}" onclick="openModal('${b.id}')">
                <div class="badge-icon-circle">${b.icon}</div>
                <div class="badge-card-name">${b.name}</div>
                <div class="badge-card-desc">${b.description}</div>
                <span class="rarity-tag rarity-${b.rarity}">${rarityLabels[b.rarity]}</span>
            </div>`;
        }

        function openModal(id) {
            const b = allBadges.find(x => x.id === id); if (!b) return;
            const ok = !!userBadges[id];
            document.getElementById('modalIcon').textContent = b.icon;
            document.getElementById('modalName').textContent = b.name;
            document.getElementById('modalRarity').textContent = rarityLabels[b.rarity];
            document.getElementById('modalRarity').className = 'rarity-tag rarity-' + b.rarity;
            document.getElementById('modalDesc').textContent = b.description;
            document.getElementById('modalCondition').textContent = condText(b.unlock_condition);
            const s = document.getElementById('modalStatus');
            if (ok) { s.textContent = '✅ 已解锁 · ' + fmtDate(userBadges[id].unlocked_at); s.className = 'modal-status ok'; }
            else    { s.textContent = '🔒 尚未解锁，继续加油！'; s.className = 'modal-status no'; }

            if (ok && userBadges[id].is_new) {
                fetch(`/api/badge/${id}/mark-viewed`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({user_id:USER_ID}) });
                userBadges[id].is_new = false; render();
            }
            document.getElementById('detailModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('detailModal').style.display = 'none'; }

        function condText(c) {
            const m = {
                'first_practice': '完成第一次模拟练习',
                'first_high_score': `首次练习得分 ≥ ${c.threshold} 分`,
                'total_practices': `累计完成 ${c.count} 次练习`,
                'streak': `连续 ${c.days} 天登录练习`,
                'scenario_high_score': `${sName(c.scenario)}场景得分 ≥ ${c.threshold} 分`,
                'scenario_practices': `${sName(c.scenario)}场景完成 ${c.count} 次练习`,
                'speed_score': `${c.duration} 秒内完成答题且得分 ≥ ${c.threshold} 分`,
                'all_scenarios': '所有场景各完成 1 次练习',
                'view_explanations': `查看 ${c.count} 道题目解析`,
                'improvement': `同一场景练习 ${c.scenario_count} 次后得分提升 ${c.improvement} 分`,
            };
            return m[c.type] || '完成特定成就';
        }
        function sName(id) {
            const m = {'job_interview':'求职面试','teacher_cert':'教资面试','ielts_speaking':'雅思口语','civil_service':'公务员面试','graduate_school':'考研复试','mba_interview':'MBA面试'};
            return m[id] || id;
        }
        function fmtDate(s) { if(!s)return''; const d=new Date(s); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }

        init();
    </script>
</body>
</html>
