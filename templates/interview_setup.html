<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面试设置 — 百工</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .setup-layout {
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
        }

        .setup-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .setup-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--gray-900);
            letter-spacing: -0.02em;
        }
        .setup-header .back-btn {
            color: var(--gray-400);
            text-decoration: none;
            font-size: 20px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .setup-header .back-btn:hover { background: var(--gray-50); color: var(--blue-500); }
        .setup-header .scenario-tag {
            font-size: 12px;
            font-weight: 500;
            padding: 4px 12px;
            background: var(--blue-50);
            color: var(--blue-600);
            border-radius: 100px;
            margin-left: auto;
        }

        .setup-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }

        .setup-card {
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: 16px;
            padding: 22px 24px;
            transition: border-color 0.2s;
        }

        .setup-card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .setup-card-desc {
            font-size: 13px;
            color: var(--gray-400);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-700);
        }
        .form-label .required { color: #EF4444; margin-left: 2px; }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--gray-200);
            border-radius: 10px;
            color: var(--gray-700);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
            outline: none;
            background: #fff;
        }
        .form-input:focus { border-color: var(--blue-400); box-shadow: 0 0 0 3px rgba(59,130,246,0.08); }
        .form-input::placeholder { color: var(--gray-400); }

        .form-textarea {
            min-height: 110px;
            resize: vertical;
            line-height: 1.6;
        }

        .form-hint {
            margin-top: 8px;
        }

        .example-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            padding: 3px 10px;
            border-radius: 6px;
            background: var(--blue-50);
            color: var(--blue-600);
            cursor: pointer;
            margin-right: 4px;
            margin-bottom: 4px;
            transition: all 0.2s;
        }
        .example-badge:hover { background: var(--blue-100); }

        .info-list {
            list-style: none;
            padding: 0;
        }
        .info-list li {
            padding: 12px 0;
            border-bottom: 1px solid var(--gray-100);
            font-size: 13px;
            color: var(--gray-500);
            display: flex;
            gap: 10px;
            line-height: 1.5;
        }
        .info-list li:last-child { border-bottom: none; }
        .info-list .icon { flex-shrink: 0; width: 20px; text-align: center; }

        .spider-preview { margin-top: 20px; }
        .spider-preview-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 12px;
        }
        .spider-question {
            padding: 10px 14px;
            background: var(--gray-50);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--gray-600);
            line-height: 1.5;
            border-left: 3px solid var(--blue-400);
        }
        .spider-empty {
            font-size: 13px;
            color: var(--gray-400);
            text-align: center;
            padding: 24px 0;
        }
        .spider-loading {
            text-align: center;
            padding: 20px 0;
            color: var(--gray-400);
            font-size: 13px;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--gray-200);
            border-top-color: var(--blue-500);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            .setup-grid { grid-template-columns: 1fr; }
            body { padding: 20px 12px; }
            .setup-card { padding: 24px; }
            .btn-group { grid-column: 1; }
        }
    </style>
</head>
<body>
    {% include 'components/nav.html' %}

    <main>
        <div class="container setup-layout">
            <div class="setup-header">
                <a href="/scenarios" class="back-btn">&larr;</a>
                <h1>面试设置</h1>
                <span class="scenario-tag" id="scenarioTag">{{ scenario_name }}</span>
            </div>

            <div class="setup-grid">
                <!-- Left: Dynamic form -->
                <div class="setup-card">
                    <div class="setup-card-title" id="formTitle">&#128221; 填写信息</div>
                    <div class="setup-card-desc" id="formDesc">填写相关信息，AI 将为你生成个性化面试题</div>

                    <form id="setupForm" onsubmit="handleSubmit(event)">
                        <div id="formFields">
                            <!-- rendered by JS -->
                        </div>
                    </form>
                </div>

                <!-- Right sidebar -->
                <div>
                    <div class="setup-card" style="margin-bottom:12px;">
                        <div class="setup-card-title">&#128202; 场景信息</div>
                        <ul class="info-list">
                            <li><span class="icon">&#128218;</span> <span><strong>场景：</strong><span id="displayScenarioName">{{ scenario_name }}</span></span></li>
                            <li><span class="icon">&#9203;</span> <span>预计进行 <strong>5</strong> 轮问答</span></li>
                            <li><span class="icon" id="infoIcon">&#9889;</span> <span id="infoText">AI 考官将根据你填写的信息，从面经题库中抽取相关问题</span></li>
                            <li><span class="icon">&#128274;</span> <span>面试过程仅本地保存，不上传服务器</span></li>
                        </ul>
                    </div>

                    <div class="setup-card">
                        <div class="setup-card-title">&#128270; 相关真实面试题</div>
                        <div class="setup-card-desc" id="spiderDesc">填写信息后，系统将自动搜索真实面经中的高频问题</div>
                        <div class="spider-preview" id="spiderPreview">
                            <div class="spider-empty">&#128069; 填写相关信息后自动匹配真实面经问题</div>
                        </div>
                    </div>
                </div>

                <div class="btn-group">
                    <a href="/scenarios" class="btn btn-secondary">取消</a>
                    <button class="btn btn-primary" id="startBtn" onclick="handleSubmit(event)" disabled>开始面试 &#10132;</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <a href="/" class="nav-logo">百<span>工</span></a>
            <span class="copyright">AI 模拟面试平台</span>
        </div>
    </footer>

                        examples: [

            graduate_school: {

                desc: '输入你的目标院校和专业，AI 将模拟考研复试面试场景',

                fields: [

                            { text: '实践型', value: '本科软件工程专业，GPA 3.7/4.0，参与2个校企合作项目，获ACM区域赛铜奖，有互联网公司实习经历' },
                        ]

            },

                infoText: 'AI 考官将根据报考岗位特点，进行结构化面试题型训练',
                urlKeys: ['position', 'department', 'resume'],
                fields: [
                    {
                        id: 'position', label: '报考岗位类别', required: true,
                        placeholder: '例如：综合管理类、行政执法类',
                        examples: ['综合管理类', '行政执法类', '专业技术类', '乡镇街道']
                    },
                    {
                        id: 'department', label: '报考单位', required: false,
                        placeholder: '例如：税务局、公安局、发改委',
                        examples: ['税务局', '公安局', '发改委', '市场监督局', '乡镇政府']
                    },
                    {
                        id: 'resume', label: '个人经历 / 专业背景', type: 'textarea', required: true,
                        placeholder: '请描述你的教育背景、工作经历、政治面貌、基层经验等',
                        examples: [
                            { text: '应届生', value: '211大学公共管理专业应届毕业生，党员，有学生会干部经历，参加过暑期基层挂职锻炼' },
                            { text: '在职', value: '3年事业单位工作经验，负责文书处理和群众接待，熟悉机关工作流程，多次获得年度考核优秀' },
                        ]
                    }
                ]
            },
            mba_interview: {
                title: '填写MBA面试信息',
                desc: '输入目标院校和职业背景，AI 将模拟商学院面试场景',
                infoText: 'AI 考官将根据你的职业背景和管理经验，考察领导力和商业洞察',
                urlKeys: ['school', 'company', 'resume'],
                fields: [
                    {
                        id: 'school', label: '目标院校', required: true,
                        placeholder: '例如：清华经管、北大光华、复旦管院',
                        examples: ['清华经管', '北大光华', '复旦管院', '上交安泰', '长江商学院']
                    },
                    {
                        id: 'company', label: '所在公司 / 行业', required: true,
                        placeholder: '例如：互联网、金融、咨询',
                        examples: ['互联网行业', '金融行业', '管理咨询', '医疗健康', '制造业']
                    },
                    {
                        id: 'resume', label: '工作经历 / 管理经验', type: 'textarea', required: true,
                        placeholder: '请描述你的工作经历、管理经验、职业成就、职业规划等',
                        examples: [
                            { text: '管理岗', value: '7年互联网行业经验，现任某中型公司产品总监，带15人团队，负责多个千万级营收产品线，MBA联考分数185+' },
                            { text: '创业者', value: '连续创业者，现为某AI领域创业公司CEO，团队30人，已完成A轮融资2000万。本科985院校，希望系统提升管理能力' },
                        ]
                    }
                ]
            }
        };

        const SCENARIO_NAMES = {
            job_interview: '求职面试',
            teacher_cert: '教资面试',
            ielts_speaking: '雅思口语',
            civil_service: '公务员面试',
            graduate_school: '考研复试',
            mba_interview: 'MBA面试',
        };

        // ================================================================
        // 渲染表单
        // ================================================================
        const config = SCENARIO_CONFIG[SCENARIO_ID] || SCENARIO_CONFIG.job_interview;
        let searchTimer = null;

        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('formTitle').textContent = '\u270f\ufe0f ' + (config.title || '填写信息');
            document.getElementById('formDesc').textContent = config.desc || '';
            if (config.infoText) {
                document.getElementById('infoText').textContent = config.infoText;
            }
            renderFields();
        });

        function renderFields() {
            const container = document.getElementById('formFields');
            container.innerHTML = '';

            config.fields.forEach(function (f) {
                const group = document.createElement('div');
                group.className = 'form-group';

                const label = document.createElement('label');
                label.className = 'form-label';
                label.textContent = f.label;
                if (f.required) {
                    const req = document.createElement('span');
                    req.className = 'required';
                    req.textContent = ' *';
                    label.appendChild(req);
                }
                group.appendChild(label);

                if (f.type === 'textarea') {
                    const textarea = document.createElement('textarea');
                    textarea.className = 'form-input form-textarea';
                    textarea.id = f.id;
                    textarea.placeholder = f.placeholder || '';
                    if (f.required) textarea.required = true;
                    group.appendChild(textarea);
                } else {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'form-input';
                    input.id = f.id;
                    input.placeholder = f.placeholder || '';
                    if (f.required) input.required = true;
                    group.appendChild(input);
                }

                if (f.examples && f.examples.length) {
                    const hint = document.createElement('div');
                    hint.className = 'form-hint';
                    f.examples.forEach(function (ex) {
                        const badge = document.createElement('span');
                        badge.className = 'example-badge';
                        if (typeof ex === 'string') {
                            badge.textContent = ex;
                            badge.onclick = function () { setExample(f.id, ex); };
                        } else {
                            badge.textContent = ex.text;
                            badge.onclick = function () { setExample(f.id, ex.value); };
                        }
                        hint.appendChild(badge);
                    });
                    group.appendChild(hint);
                }

                container.appendChild(group);
            });

            config.fields.forEach(function (f) {
                const el = document.getElementById(f.id);
                if (!el) return;
                el.addEventListener('input', function () {
                    checkForm();
                    triggerSearch();
                });
            });

            checkForm();
        }

        function checkForm() {
            const required = config.fields.filter(function (f) { return f.required; });
            const allFilled = required.every(function (f) {
                const el = document.getElementById(f.id);
                return el && el.value.trim();
            });
            document.getElementById('startBtn').disabled = !allFilled;
        }

        function triggerSearch() {
            clearTimeout(searchTimer);
            const spiderFieldId = config.spiderField || config.fields[0].id;
            const el = document.getElementById(spiderFieldId);
            const val = el ? el.value.trim() : '';
            if (val.length >= 2) {
                searchTimer = setTimeout(function () {
                    var params = {};
                    config.fields.forEach(function (f) {
                        var inp = document.getElementById(f.id);
                        if (inp && inp.value.trim()) {
                            params[f.id] = inp.value.trim();
                        }
                    });
                    searchSpider(params);
                }, 500);
            }
        }

        async function searchSpider(params) {
            const preview = document.getElementById('spiderPreview');
            preview.innerHTML = '<div class="spider-loading"><span class="spinner"></span>正在搜索相关面经...</div>';

            try {
                const qp = new URLSearchParams();
                var searchVal = '';
                config.fields.forEach(function (f) {
                    if (!searchVal && params[f.id]) searchVal = params[f.id];
                });
                if (searchVal) qp.set('position', searchVal);
                // 传入完整背景信息以提取更多关键词
                var bgEl = document.getElementById('background');
                if (bgEl && bgEl.value.trim()) qp.set('user_background', bgEl.value.trim());
                qp.set('scenario_id', SCENARIO_ID);
                qp.set('limit', '6');

                const resp = await fetch('/api/interview/search?' + qp.toString());
                const result = await resp.json();

                if (result.success && result.data.length > 0) {
                    const allQuestions = [];
                    result.data.forEach(function (item) {
                        if (item.questions && Array.isArray(item.questions)) {
                            item.questions.forEach(function (q) {
                                if (allQuestions.indexOf(q) === -1) allQuestions.push(q);
                            });
                        }
                    });

                    if (allQuestions.length > 0) {
                        const show = allQuestions.slice(0, 6);
                        var html = '<div class="spider-preview-title">\uD83D\uDCC3 来自 ' + result.data.length + ' 篇面经的常见问题</div>';
                        show.forEach(function (q) {
                            html += '<div class="spider-question">' + escapeHtml(q) + '</div>';
                        });
                        if (allQuestions.length > 6) {
                            html += '<div style="text-align:center;font-size:0.8rem;color:var(--gray-400);margin-top:8px;">还有 ' + (allQuestions.length - 6) + ' 道相关题目将在面试中展示</div>';
                        }
                        preview.innerHTML = html;
                    } else {
                        preview.innerHTML = '<div class="spider-empty">💠 找到面经记录，但未能提取到具体问题</div>';
                    }
                } else {
                    preview.innerHTML = '<div class="spider-empty">🔍 暂未找到相关数据，AI 将基于真题库生成问题</div>';
                }
            } catch (e) {
                preview.innerHTML = '<div class="spider-empty">\uD83D\uDD0D 面经搜索暂不可用，AI 将直接为你出题</div>';
            }
        }

        function handleSubmit(event) {
            event.preventDefault();

            var params = new URLSearchParams();
            var allFilled = true;

            config.fields.forEach(function (f) {
                var el = document.getElementById(f.id);
                var val = el ? el.value.trim() : '';
                if (f.required && !val) allFilled = false;
                if (val) params.set(f.id, val);
            });

            if (!allFilled) {
                alert('请填写所有必填项');
                return;
            }

            window.location.href = '/chat/' + SCENARIO_ID + '?' + params.toString();
        }

        function setExample(fieldId, value) {
            document.getElementById(fieldId).value = value;
            document.getElementById(fieldId).dispatchEvent(new Event('input'));
            checkForm();
            triggerSearch();
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
