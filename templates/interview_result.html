<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试结果 — 百工</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ========== 容器 ========== */
.result-container {
  max-width: 960px;
  margin: 0 auto;
  padding: 24px 24px 60px;
}

/* ========== 头部导航 ========== */
.result-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0;
  margin-bottom: 32px;
  border-bottom: 1px solid var(--gray-100);
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--gray-500);
  font-weight: 500;
  transition: color 0.2s;
}
.back-link:hover { color: var(--gray-700); }
.back-link svg { width: 16px; height: 16px; }

.header-date {
  font-size: 13px;
  color: var(--gray-400);
}

/* ========== 分数卡片 ========== */
.score-card {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 16px;
  padding: 36px 40px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 48px;
}

.score-ring-wrap {
  flex-shrink: 0;
  position: relative;
  width: 148px;
  height: 148px;
}

.score-ring {
  width: 148px;
  height: 148px;
  border-radius: 50%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.score-ring svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.score-ring-bg {
  fill: none;
  stroke: var(--gray-100);
  stroke-width: 10;
}

.score-ring-fill {
  fill: none;
  stroke: url(#scoreGradient);
  stroke-width: 10;
  stroke-linecap: round;
  transition: stroke-dashoffset 1.5s ease-out;
}

.score-num {
  font-size: 3rem;
  font-weight: 800;
  color: var(--gray-900);
  letter-spacing: -0.03em;
  line-height: 1;
}

.score-num .unit {
  font-size: 1rem;
  font-weight: 500;
  color: var(--gray-400);
}

.score-meta { flex: 1; }

.pass-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 16px;
}
.pass-badge.passed {
  background: rgba(16, 185, 129, 0.08);
  color: var(--green-500);
}
.pass-badge.failed {
  background: rgba(239, 68, 68, 0.08);
  color: var(--red-500);
}

.score-details {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.score-detail-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--gray-500);
}
.score-detail-item .detail-icon { font-size: 16px; }
.score-detail-item .detail-val {
  color: var(--gray-700);
  font-weight: 500;
}

/* ========== 通用卡片 ========== */
.result-card {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 16px;
  padding: 28px 32px;
  margin-bottom: 20px;
}

.section-heading {
  font-size: 16px;
  font-weight: 600;
  color: var(--gray-900);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-heading .ico { font-size: 18px; }

/* ========== 雷达图 ========== */
.radar-wrap {
  max-width: 440px;
  margin: 0 auto;
}
.radar-wrap canvas { width: 100% !important; }
.empty-chart {
  text-align: center;
  padding: 32px;
  color: var(--gray-400);
  font-size: 14px;
}

/* ========== 点评卡片 ========== */
.review-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.review-box {
  border-radius: 12px;
  padding: 20px;
  min-height: 120px;
}

.review-box.strengths {
  background: rgba(16, 185, 129, 0.04);
  border: 1px solid rgba(16, 185, 129, 0.15);
}
.review-box.improvements {
  background: rgba(245, 158, 11, 0.04);
  border: 1px solid rgba(245, 158, 11, 0.15);
}

.review-box .review-label {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.review-box.strengths .review-label { color: #059669; }
.review-box.improvements .review-label { color: #d97706; }

.review-box ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.review-box li {
  font-size: 14px;
  color: var(--gray-600);
  line-height: 1.5;
  padding-left: 18px;
  position: relative;
}
.review-box.strengths li::before { content: '✓'; position:absolute; left:0; color:#10b981; font-weight:700; }
.review-box.improvements li::before { content: '→'; position:absolute; left:0; color:#f59e0b; font-weight:700; }

.overall-note {
  margin-top: 16px;
  padding: 16px 20px;
  background: var(--blue-50);
  border-radius: 12px;
  font-size: 14px;
  color: var(--gray-600);
  line-height: 1.7;
}

/* ========== 徽章 ========== */
.badge-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}

.badge-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  background: var(--gray-50);
  border: 1px solid var(--gray-100);
  border-radius: 12px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.badge-item:hover {
  border-color: var(--blue-200);
  box-shadow: 0 2px 8px rgba(59, 130, 246, 0.08);
}

.badge-item .badge-icon-wrap {
  width: 44px; height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  background: var(--blue-50);
  border-radius: 10px;
  flex-shrink: 0;
}

.badge-item .badge-text .badge-name {
  font-weight: 600;
  font-size: 14px;
  color: var(--gray-900);
  margin-bottom: 2px;
}
.badge-item .badge-text .badge-desc {
  font-size: 12px;
  color: var(--gray-400);
  line-height: 1.4;
}

/* ========== 答题回顾 ========== */
.answer-card {
  padding: 16px 0;
  border-bottom: 1px solid var(--gray-100);
}
.answer-card:last-child { border-bottom: none; }

.answer-card .round-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  color: var(--blue-500);
  background: var(--blue-50);
  padding: 2px 10px;
  border-radius: 10px;
  margin-bottom: 8px;
}

.answer-card .q-text {
  font-size: 14px;
  color: var(--gray-900);
  font-weight: 500;
  margin-bottom: 6px;
}

.answer-card .a-text {
  font-size: 13px;
  color: var(--gray-500);
  line-height: 1.5;
  margin-bottom: 6px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.answer-card .a-score {
  font-size: 13px;
  font-weight: 600;
  color: var(--blue-500);
}

/* ========== 操作按钮 ========== */
.action-bar {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  padding: 8px 0 24px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 28px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s;
  border: none;
  font-family: inherit;
}

.btn-primary {
  background: var(--blue-500);
  color: #fff;
}
.btn-primary:hover {
  background: var(--blue-600);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
}

.btn-secondary {
  background: #fff;
  color: var(--gray-700);
  border: 1px solid var(--gray-200);
}
.btn-secondary:hover {
  background: var(--gray-50);
  border-color: var(--gray-300);
}

.btn-ghost {
  background: transparent;
  color: var(--gray-500);
}
.btn-ghost:hover {
  color: var(--gray-700);
  background: var(--gray-50);
}

/* ========== 加载 / 错误 ========== */
.loading-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  gap: 16px;
}
.spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--gray-100);
  border-top-color: var(--blue-500);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-wrap p { color: var(--gray-400); font-size: 14px; }

.error-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  gap: 12px;
  text-align: center;
}
.error-wrap .err-icon {
  width: 72px; height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  background: var(--gray-50);
  border-radius: 50%;
  border: 1px solid var(--gray-100);
}
.error-wrap h3 { font-size: 17px; color: var(--gray-900); }
.error-wrap p { font-size: 14px; color: var(--gray-400); max-width: 360px; }

/* ========== 响应式 ========== */
@media (max-width: 768px) {
  .result-container { padding: 16px 16px 40px; }
  .score-card {
    flex-direction: column;
    text-align: center;
    gap: 24px;
    padding: 28px 24px;
  }
  .score-details { justify-content: center; }
  .score-ring-wrap { width: 120px; height: 120px; }
  .score-ring { width: 120px; height: 120px; }
  .score-num { font-size: 2.4rem; }
  .review-grid { grid-template-columns: 1fr; }
  .action-bar { flex-direction: column; align-items: stretch; }
  .action-bar .btn { justify-content: center; }
  .badge-list { grid-template-columns: 1fr; }
}

@media (max-width: 480px) {
  .result-header { flex-direction: column; gap: 8px; align-items: flex-start; }
}
</style>
</head>
<body>

{% include 'components/nav.html' %}

<div class="result-container">
  <!-- 加载 -->
  <div class="loading-wrap" id="loadingState">
    <div class="spinner"></div>
    <p>正在加载面试报告...</p>
  </div>

  <!-- 错误 -->
  <div class="error-wrap" id="errorState" style="display:none;">
    <div class="err-icon">⚠️</div>
    <h3>加载失败</h3>
    <p id="errorMessage">无法加载面试结果数据，请稍后重试。</p>
    <a href="/" class="btn btn-primary" style="margin-top:12px;">返回首页</a>
  </div>

  <!-- 主内容 -->
  <div id="mainContent" style="display:none;">
    <!-- 头部 -->
    <div class="result-header">
      <a href="/" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        返回首页
      </a>
      <div class="header-date" id="headerDate"></div>
    </div>

    <!-- 分数卡片 -->
    <div class="score-card">
      <div class="score-ring-wrap">
        <div class="score-ring">
          <svg viewBox="0 0 148 148">
            <defs>
              <linearGradient id="scoreGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#3b82f6"/>
                <stop offset="100%" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
            <circle class="score-ring-bg" cx="74" cy="74" r="64"/>
            <circle class="score-ring-fill" id="scoreRingFill" cx="74" cy="74" r="64"
                    stroke-dasharray="402.12" stroke-dashoffset="402.12"/>
          </svg>
          <div class="score-num">
            <span id="scoreNumber">0</span><span class="unit">分</span>
          </div>
        </div>
      </div>
      <div class="score-meta">
        <div class="pass-badge" id="passBadge">
          <span id="passIcon"></span> <span id="passLabel"></span>
        </div>
        <div class="score-details">
          <div class="score-detail-item">
            <span class="detail-icon">📊</span> 超越 <span class="detail-val" id="percentileValue">0</span>% 的考生
          </div>
          <div class="score-detail-item">
            <span class="detail-icon">🎯</span> <span class="detail-val" id="metaScenario"></span>
          </div>
          <div class="score-detail-item">
            <span class="detail-icon">⏱️</span> <span class="detail-val" id="metaDuration"></span>
          </div>
          <div class="score-detail-item">
            <span class="detail-icon">📝</span> 共 <span class="detail-val" id="metaRounds"></span>
          </div>
          <div class="score-detail-item">
            <span class="detail-icon">📅</span> <span class="detail-val" id="metaDate"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- 能力雷达图 -->
    <div class="result-card" id="radarSection">
      <div class="section-heading"><span class="ico">📊</span> 能力评估</div>
      <div class="radar-wrap"><canvas id="radarChart"></canvas></div>
      <div class="empty-chart" id="emptyRadar" style="display:none;">暂无维度评分数据</div>
    </div>

    <!-- 考官点评 -->
    <div class="result-card" id="reviewSection">
      <div class="section-heading"><span class="ico">💬</span> 考官点评</div>
      <div class="review-grid" id="reviewGrid">
        <div class="review-box strengths">
          <div class="review-label">✓ 优势亮点</div>
          <ul id="strengthsList"><li>暂无数据</li></ul>
        </div>
        <div class="review-box improvements">
          <div class="review-label">→ 改进建议</div>
          <ul id="improvementsList"><li>暂无数据</li></ul>
        </div>
      </div>
      <div class="overall-note" id="overallComment" style="display:none;"></div>
    </div>

    <!-- 新徽章 -->
    <div class="result-card" id="badgesSection" style="display:none;">
      <div class="section-heading"><span class="ico">🏆</span> 新解锁徽章</div>
      <div class="badge-list" id="badgesGrid"></div>
    </div>

    <!-- 答题回顾 -->
    <div class="result-card" id="answersSection" style="display:none;">
      <div class="section-heading"><span class="ico">📋</span> 答题回顾</div>
      <div id="answersList"></div>
    </div>

    <!-- 操作按钮 -->
    <div class="action-bar">
      <button class="btn btn-primary" onclick="restartInterview()">🔄 再来一次</button>
      <a href="/growth" class="btn btn-secondary">📈 查看成长档案</a>
      <a href="/" class="btn btn-ghost">🏠 返回首页</a>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var conversationId = '{{ conversation_id }}';
  var chartInstance = null;

  var $ = function(id) { return document.getElementById(id); };
  var loadingState = $('loadingState');
  var errorState = $('errorState');
  var mainContent = $('mainContent');
  var errorMessage = $('errorMessage');

  document.addEventListener('DOMContentLoaded', function() {
    fetchResult();
  });

  function fetchResult() {
    fetch('/api/result/' + conversationId)
      .then(function(r) { return r.json(); })
      .then(function(resp) {
        if (!resp.success) throw new Error(resp.error || '加载失败');
        loadingState.style.display = 'none';
        mainContent.style.display = 'block';
        render(resp.data);
      })
      .catch(function(err) {
        loadingState.style.display = 'none';
        errorState.style.display = 'flex';
        errorMessage.textContent = err.message || '无法加载面试结果数据';
      });
  }

  function render(data) {
    window._resultScenarioId = data.scenario_id || 'job_interview';

    var d = data.created_at ? data.created_at.substring(0, 10) : '';
    $('headerDate').textContent = d ? '面试日期: ' + d : '';
    $('metaScenario').textContent = data.scenario_name || data.scenario_id || '';
    $('metaDuration').textContent = data.total_duration_min ? (data.total_duration_min + ' 分钟') : '—';
    $('metaRounds').textContent = (data.round_count || 0) + ' 轮回答';
    $('metaDate').textContent = d || '—';
    $('percentileValue').textContent = data.percentile || 0;

    // 分数滚动动画
    var finalScore = data.overall_score || 0;
    animateScore(finalScore);

    // 通过/未通过
    var passed = data.overall_score >= 60;
    var passBadge = $('passBadge');
    passBadge.className = 'pass-badge ' + (passed ? 'passed' : 'failed');
    $('passIcon').textContent = passed ? '✓' : '✗';
    $('passLabel').textContent = passed ? '通过' : '未通过';

    // 雷达图
    if (data.dimensions && data.dimensions.length > 0) {
      renderRadar(data.dimensions);
    } else {
      $('emptyRadar').style.display = 'block';
      document.querySelector('#radarSection .radar-wrap').style.display = 'none';
    }

    renderReview(data);

    if (data.new_badges && data.new_badges.length > 0) {
      renderBadges(data.new_badges);
    }

    if (data.answers && data.answers.length > 0) {
      renderAnswers(data.answers);
    }

    if (data.overall_comment) {
      var oc = $('overallComment');
      oc.textContent = data.overall_comment;
      oc.style.display = 'block';
    }
  }

  // ========== 分数动画 ==========
  function animateScore(target) {
    var el = $('scoreNumber');
    var ring = $('scoreRingFill');
    var circumference = 402.12; // 2 * π * 64
    var duration = 1500;
    var start = performance.now();
    var from = 0;

    function step(now) {
      var elapsed = now - start;
      var progress = Math.min(elapsed / duration, 1);
      // easeOutCubic
      var eased = 1 - Math.pow(1 - progress, 3);
      var current = Math.round(from + (target - from) * eased);
      el.textContent = current;
      // 更新圆环
      var offset = circumference - (circumference * (current / 100));
      ring.setAttribute('stroke-dashoffset', offset);

      if (progress < 1) {
        requestAnimationFrame(step);
      }
    }
    requestAnimationFrame(step);
  }

  // ========== 雷达图 ==========
  function renderRadar(dimensions) {
    var ctx = $('radarChart').getContext('2d');
    var labels = dimensions.map(function(d) { return d.name; });
    var scores = dimensions.map(function(d) { return d.score; });

    chartInstance = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: labels,
        datasets: [{
          label: '本次得分',
          data: scores,
          backgroundColor: 'rgba(59, 130, 246, 0.08)',
          borderColor: '#3b82f6',
          borderWidth: 2,
          pointBackgroundColor: '#3b82f6',
          pointBorderColor: '#fff',
          pointBorderWidth: 2,
          pointRadius: 5,
          pointHoverRadius: 7,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        animation: { duration: 800, easing: 'easeOutQuart' },
        scales: {
          r: {
            min: 0,
            max: 100,
            ticks: { stepSize: 20, color: '#9ca3af', backdropColor: 'transparent', font: { size: 10 } },
            grid: { color: 'rgba(229, 231, 235, 0.8)' },
            angleLines: { color: 'rgba(229, 231, 235, 0.8)' },
            pointLabels: {
              color: '#374151',
              font: { family: "Inter, -apple-system, 'PingFang SC', sans-serif", size: 11, weight: '500' }
            }
          }
        },
        plugins: {
          legend: { display: false }
        }
      }
    });
  }

  // ========== 点评 ==========
  function renderReview(data) {
    var sl = $('strengthsList');
    var il = $('improvementsList');

    if (data.strengths && data.strengths.length > 0) {
      sl.innerHTML = data.strengths.map(function(s) { return '<li>' + esc(s) + '</li>'; }).join('');
    } else {
      sl.innerHTML = '<li style="color:var(--gray-400);padding-left:0;">暂无数据</li>';
    }

    if (data.improvements && data.improvements.length > 0) {
      il.innerHTML = data.improvements.map(function(s) { return '<li>' + esc(s) + '</li>'; }).join('');
    } else {
      il.innerHTML = '<li style="color:var(--gray-400);padding-left:0;">暂无数据</li>';
    }
  }

  // ========== 徽章 ==========
  function renderBadges(badges) {
    var section = $('badgesSection');
    var grid = $('badgesGrid');
    section.style.display = 'block';

    grid.innerHTML = badges.map(function(b) {
      return '<div class="badge-item">' +
        '<div class="badge-icon-wrap">' + (b.icon || '🎯') + '</div>' +
        '<div class="badge-text">' +
          '<div class="badge-name">' + esc(b.name || '') + '</div>' +
          '<div class="badge-desc">' + esc(b.description || '') + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  // ========== 答题回顾 ==========
  function renderAnswers(answers) {
    var section = $('answersSection');
    var list = $('answersList');
    section.style.display = 'block';

    list.innerHTML = answers.map(function(a) {
      return '<div class="answer-card">' +
        '<div class="round-tag">第 ' + (a.round || '?') + ' 题</div>' +
        '<div class="q-text">' + esc(a.question || '(无题目)') + '</div>' +
        '<div class="a-text">' + esc(a.answer || '') + '</div>' +
        (a.score != null ? '<div class="a-score">得分: ' + a.score + ' 分</div>' : '') +
      '</div>';
    }).join('');
  }

  function esc(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ========== 重新面试 ==========
  window.restartInterview = function() {
    var sid = window._resultScenarioId || 'job_interview';
    window.location.href = '/chat/' + sid;
  };

  window._resultScenarioId = '';

})();
</script>

</body>
</html>
