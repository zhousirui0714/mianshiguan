<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成长中心 — 百工</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: 14px;
            padding: 24px;
            text-align: center;
        }
        .stat-card .icon { font-size: 28px; margin-bottom: 8px; }
        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            color: var(--blue-500);
            letter-spacing: -0.03em;
        }
        .stat-card .label {
            font-size: 13px;
            color: var(--gray-400);
            margin-top: 4px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        .chart-card {
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: 16px;
            padding: 24px;
        }
        .chart-card.full { grid-column: 1 / -1; }
        .chart-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 16px;
        }
        .chart-wrap {
            position: relative;
            height: 260px;
        }

        .activity-list { list-style: none; }
        .activity-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid var(--gray-100);
        }
        .activity-item:last-child { border-bottom: none; }
        .activity-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .activity-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .activity-dot.high { background: var(--green-500); }
        .activity-dot.mid { background: var(--amber-500); }
        .activity-dot.low { background: var(--red-500); }
        .activity-text { font-size: 14px; color: var(--gray-600); }
        .activity-text .scenario { color: var(--blue-600); font-weight: 500; }
        .activity-score {
            font-weight: 600;
            font-size: 14px;
            min-width: 40px;
            text-align: right;
        }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    {% include 'components/nav.html' %}

    <main>
        <div class="container">
            <div class="page-header">
                <div class="section-label">数据分析</div>
                <h1>成长中心</h1>
                <p>查看你的面试练习数据、趋势和综合分析。</p>
            </div>

            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="icon">📝</div>
                    <div class="value" id="statPractices">--</div>
                    <div class="label">练习次数</div>
                </div>
                <div class="stat-card">
                    <div class="icon">🎯</div>
                    <div class="value" id="statAvgScore">--</div>
                    <div class="label">平均得分</div>
                </div>
                <div class="stat-card">
                    <div class="icon">🏆</div>
                    <div class="value" id="statBadges">--</div>
                    <div class="label">成就徽章</div>
                </div>
                <div class="stat-card">
                    <div class="icon">🔥</div>
                    <div class="value" id="statStreak">--</div>
                    <div class="label">连续练习</div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-card">
                    <div class="chart-title">场景综合能力雷达</div>
                    <div class="chart-wrap"><canvas id="radarChart"></canvas></div>
                </div>
                <div class="chart-card">
                    <div class="chart-title">得分趋势</div>
                    <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-card">
                    <div class="chart-title">各场景平均分对比</div>
                    <div class="chart-wrap"><canvas id="barChart"></canvas></div>
                </div>
                <div class="chart-card">
                    <div class="chart-title">分数分布</div>
                    <div class="chart-wrap"><canvas id="distributionChart"></canvas></div>
                </div>
            </div>

            <div class="chart-card full">
                <div class="chart-title">最近练习记录</div>
                <div id="activityContainer">
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>还没有练习记录</h3>
                        <p>开始一次模拟面试，你的练习记录将在这里展示。</p>
                        <a href="/scenarios" class="btn btn-primary">开始练习</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <a href="/" class="nav-logo">百<span>工</span></a>
            <span class="copyright">AI 模拟面试平台</span>
        </div>
    </footer>

    <script>
    const USER_ID = 'viz_user';

    const SCENARIO_NAMES = {
        'job_interview': '求职面试', 'teacher-cert': '教资面试',
        'ielts-speaking': '雅思口语', 'civil-service': '公务员面试',
        'graduate-school': '考研复试', 'mba-interview': 'MBA面试'
    };
    const SCENARIO_COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#60a5fa', '#ec4899'];
    const SCENARIOS = Object.keys(SCENARIO_NAMES);

    async function init() {
        try {
            const [summary, progress, answers, badges] = await Promise.all([
                fetch('/api/user/' + USER_ID + '/summary').then(r => r.json()),
                fetch('/api/user/' + USER_ID + '/progress').then(r => r.json()),
                fetch('/api/user/' + USER_ID + '/answers').then(r => r.json()),
                fetch('/api/user/' + USER_ID + '/badges').then(r => r.json()),
            ]);

            const sData = summary.data || {};
            const pData = progress.data || [];
            const aData = answers.data || [];
            const bData = badges.data || [];

            document.getElementById('statPractices').textContent = sData.total_practices || 0;
            document.getElementById('statAvgScore').textContent = (sData.avg_score || 0) + '分';
            document.getElementById('statBadges').textContent = bData.length || 0;
            document.getElementById('statStreak').textContent = (await getStreak()) + '天';

            renderRadarChart(pData);
            renderTrendChart(pData);
            renderBarChart(pData);
            renderDistributionChart(sData.score_distribution);
            renderActivityList(aData);
        } catch (err) {
            console.error('加载失败:', err);
        }
    }

    async function getStreak() {
        try {
            var r = await fetch('/api/user/' + USER_ID + '/streak');
            return (await r.json()).streak || 0;
        } catch { return 0; }
    }

    function renderRadarChart(data) {
        var ctx = document.getElementById('radarChart').getContext('2d');
        var scores = SCENARIOS.map(function(id) {
            var p = data.find(function(d) { return d.scenario_id === id; });
            return p ? (p.avg_score || 0) : 0;
        });
        if (scores.every(function(s) { return s === 0; })) return showEmpty(ctx);
        new Chart(ctx, {
            type: 'radar',
            data: {
                labels: SCENARIOS.map(function(id) { return SCENARIO_NAMES[id]; }),
                datasets: [{
                    label: '平均得分',
                    data: scores,
                    backgroundColor: 'rgba(59,130,246,0.08)',
                    borderColor: '#3b82f6',
                    borderWidth: 2,
                    pointBackgroundColor: '#3b82f6',
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    r: {
                        beginAtZero: true, max: 100,
                        grid: { color: 'rgba(0,0,0,0.06)' },
                        angleLines: { color: 'rgba(0,0,0,0.06)' },
                        pointLabels: { color: '#6b7280', font: { size: 11 } },
                        ticks: { color: '#9ca3af', backdropColor: 'transparent', stepSize: 20 }
                    }
                },
                plugins: { legend: { labels: { color: '#6b7280' } } }
            }
        });
    }

    function renderTrendChart(data) {
        var ctx = document.getElementById('trendChart').getContext('2d');
        var all = [];
        data.forEach(function(p) {
            var scores = p.latest_scores || [];
            scores.forEach(function(s) { all.push(s); });
        });
        if (all.length === 0) return showEmpty(ctx);
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: all.map(function(_, i) { return '第' + (i + 1) + '次'; }),
                datasets: [{
                    label: '得分',
                    data: all,
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59,130,246,0.06)',
                    fill: true, tension: 0.3,
                    pointBackgroundColor: '#3b82f6', pointRadius: 4,
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, max: 100, grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { color: '#9ca3af' } },
                    x: { grid: { display: false }, ticks: { color: '#9ca3af' } }
                },
                plugins: { legend: { labels: { color: '#6b7280' } } }
            }
        });
    }

    function renderBarChart(data) {
        var ctx = document.getElementById('barChart').getContext('2d');
        var avgs = SCENARIOS.map(function(id) {
            var p = data.find(function(d) { return d.scenario_id === id; });
            return p ? (p.avg_score || 0) : 0;
        });
        var practices = SCENARIOS.map(function(id) {
            var p = data.find(function(d) { return d.scenario_id === id; });
            return p ? (p.total_practices || 0) : 0;
        });
        if (avgs.every(function(s) { return s === 0; })) return showEmpty(ctx);
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: SCENARIOS.map(function(id) { return SCENARIO_NAMES[id]; }),
                datasets: [
                    { label: '平均分', data: avgs, backgroundColor: SCENARIO_COLORS.map(function(c) { return c + 'BB'; }), borderColor: SCENARIO_COLORS, borderWidth: 1, yAxisID: 'y' },
                    { label: '练习次数', data: practices, backgroundColor: 'rgba(156,163,175,0.3)', borderColor: '#9ca3af', borderWidth: 1, yAxisID: 'y1' }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, max: 100, grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { color: '#9ca3af' }, position: 'left' },
                    y1: { beginAtZero: true, grid: { display: false }, ticks: { color: '#9ca3af' }, position: 'right' },
                    x: { grid: { display: false }, ticks: { color: '#9ca3af', font: { size: 10 } } }
                },
                plugins: { legend: { labels: { color: '#6b7280', font: { size: 11 } } } }
            }
        });
    }

    function renderDistributionChart(distribution) {
        var ctx = document.getElementById('distributionChart').getContext('2d');
        if (!distribution || Object.values(distribution).every(function(v) { return v === 0; })) return showEmpty(ctx);
        var bins = ['<60', '60-69', '70-79', '80-89', '90-100'];
        var colors = ['#ef4444', '#f59e0b', '#eab308', '#10b981', '#3b82f6'];
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: bins,
                datasets: [{ data: bins.map(function(b) { return distribution[b] || 0; }), backgroundColor: colors, borderWidth: 0 }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom', labels: { color: '#6b7280', padding: 12, font: { size: 11 } } } }
            }
        });
    }

    function renderActivityList(answers) {
        var container = document.getElementById('activityContainer');
        if (!answers || answers.length === 0) return;
        var recent = answers.slice(0, 15);
        var html = '<ul class="activity-list">';
        recent.forEach(function(a) {
            var score = a.score || 0;
            var dot = score >= 80 ? 'high' : (score >= 60 ? 'mid' : 'low');
            var sName = SCENARIO_NAMES[a.scenario_id] || a.scenario_id || '未知';
            var date = a.created_at ? new Date(a.created_at).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
            html += '<li class="activity-item">' +
                '<div class="activity-left">' +
                '<span class="activity-dot ' + dot + '"></span>' +
                '<span class="activity-text"><span class="scenario">' + sName + '</span></span>' +
                '</div>' +
                '<div><span class="activity-score" style="color:' + (dot === 'high' ? '#10b981' : dot === 'mid' ? '#f59e0b' : '#ef4444') + '">' + score + '分</span>' +
                '<span style="color:var(--gray-400);font-size:12px;margin-left:8px;">' + date + '</span></div></li>';
        });
        html += '</ul>';
        container.innerHTML = html;
    }

    function showEmpty(ctx) {
        var canvas = ctx.canvas;
        var parent = canvas.parentElement;
        canvas.style.display = 'none';
        var el = document.createElement('div');
        el.className = 'empty-state';
        el.style.padding = '40px 20px';
        el.innerHTML = '<p style="color:var(--gray-400);">暂无数据</p>';
        parent.appendChild(el);
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
