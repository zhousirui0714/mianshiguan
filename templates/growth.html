<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成长中心 - 面试成长伴侣</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --primary: #6366F1;
            --primary-light: rgba(99, 102, 241, 0.1);
            --secondary: #10B981;
            --accent: #F59E0B;
            --bg: #0F172A;
            --card: #1E293B;
            --text: #F8FAFC;
            --text-secondary: #94A3B8;
            --border: #334155;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .nav-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 40px; background: var(--card); border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 1.2rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; transition: color 0.3s; font-size: 0.9rem; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }

        .container { max-width: 1200px; margin: 0 auto; padding: 32px 40px; }

        .page-header { margin-bottom: 28px; }
        .page-header h1 { font-size: 1.6rem; font-weight: 700; }
        .page-header p { color: var(--text-secondary); font-size: 0.95rem; margin-top: 4px; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
        .stat-card {
            background: var(--card); border-radius: 12px; padding: 20px;
            border: 1px solid var(--border); text-align: center;
        }
        .stat-icon { font-size: 1.8rem; margin-bottom: 8px; }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }

        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
        .chart-card {
            background: var(--card); border-radius: 12px; padding: 24px;
            border: 1px solid var(--border);
        }
        .chart-card.full-width { grid-column: 1 / -1; }
        .chart-title { font-size: 1rem; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .chart-wrapper { position: relative; height: 260px; }
        .chart-wrapper.tall { height: 300px; }

        .activity-list { list-style: none; }
        .activity-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 0; border-bottom: 1px solid var(--border);
        }
        .activity-item:last-child { border-bottom: none; }
        .activity-info { display: flex; align-items: center; gap: 12px; }
        .activity-dot {
            width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
        }
        .activity-dot.high { background: var(--success); }
        .activity-dot.medium { background: var(--warning); }
        .activity-dot.low { background: var(--danger); }
        .activity-text { font-size: 0.9rem; }
        .activity-text .scenario-tag { color: var(--primary); font-weight: 500; }
        .activity-score { font-weight: 600; font-size: 0.9rem; min-width: 40px; text-align: right; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-state-icon { font-size: 3rem; margin-bottom: 16px; }
        .empty-state h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--text); }
        .empty-state p { font-size: 0.9rem; }

        .btn {
            display: inline-block; padding: 10px 24px; border-radius: 8px;
            font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none;
            text-decoration: none; transition: all 0.3s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #5558E3; }
        .btn-outline {
            background: transparent; border: 1px solid var(--border);
            color: var(--text-secondary); margin-left: 8px;
        }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

        .loading-spinner {
            display: flex; align-items: center; justify-content: center;
            height: 200px; color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
            .container { padding: 20px 16px; }
            .nav-bar { padding: 12px 16px; flex-direction: column; gap: 12px; }
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <div class="logo"><span>📚</span> 面试成长伴侣</div>
        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/question-bank">题库</a>
            <a href="/growth" class="active">成长中心</a>
            <a href="/badges">徽章</a>
            <a href="/mock-exam">模拟</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>成长中心</h1>
            <p>查看你的面试练习数据、趋势和综合分析</p>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="stat-icon">📝</div><div class="stat-value" id="statPractices">--</div><div class="stat-label">练习次数</div></div>
            <div class="stat-card"><div class="stat-icon">🎯</div><div class="stat-value" id="statAvgScore">--</div><div class="stat-label">平均得分</div></div>
            <div class="stat-card"><div class="stat-icon">🏆</div><div class="stat-value" id="statBadges">--</div><div class="stat-label">成就徽章</div></div>
            <div class="stat-card"><div class="stat-icon">🔥</div><div class="stat-value" id="statStreak">--</div><div class="stat-label">连续练习</div></div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title">📊 场景综合能力雷达</div>
                <div class="chart-wrapper"><canvas id="radarChart"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-title">📈 得分趋势</div>
                <div class="chart-wrapper"><canvas id="trendChart"></canvas></div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title">📊 各场景平均分对比</div>
                <div class="chart-wrapper"><canvas id="barChart"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-title">📊 分数分布</div>
                <div class="chart-wrapper"><canvas id="distributionChart"></canvas></div>
            </div>
        </div>

        <div class="chart-card full-width">
            <div class="chart-title">🕐 最近练习记录</div>
            <div id="activityContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <h3>还没有练习记录</h3>
                    <p>开始一次模拟面试，你的练习记录将在这里展示</p>
                    <a href="/" class="btn btn-primary" style="margin-top: 16px;">开始练习</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const USER_ID = 'viz_user';  // 当前用户 ID

        const SCENARIO_NAMES = {
            'job_interview': '求职面试', 'teacher-cert': '教资面试',
            'ielts-speaking': '雅思口语', 'civil-service': '公务员面试',
            'graduate-school': '考研复试', 'mba-interview': 'MBA面试'
        };
        const SCENARIO_COLORS = [
            '#6366F1', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899'
        ];
        const SCENARIOS = Object.keys(SCENARIO_NAMES);

        // 初始化所有图表为 "加载中" 状态
        async function init() {
            try {
                const [summary, progress, answers, badges] = await Promise.all([
                    fetch(`/api/user/${USER_ID}/summary`).then(r => r.json()),
                    fetch(`/api/user/${USER_ID}/progress`).then(r => r.json()),
                    fetch(`/api/user/${USER_ID}/answers`).then(r => r.json()),
                    fetch(`/api/user/${USER_ID}/badges`).then(r => r.json()),
                ]);

                const sData = summary.data || {};
                const pData = progress.data || [];
                const aData = answers.data || [];
                const bData = badges.data || [];

                // 更新统计卡片
                document.getElementById('statPractices').textContent = sData.total_practices || 0;
                document.getElementById('statAvgScore').textContent = (sData.avg_score || 0) + '分';
                document.getElementById('statBadges').textContent = bData.length || 0;
                document.getElementById('statStreak').textContent = (await getStreak()) + '天';

                // 渲染图表
                renderRadarChart(pData);
                renderTrendChart(pData);
                renderBarChart(pData);
                renderDistributionChart(sData.score_distribution);
                renderActivityList(aData);

            } catch (err) {
                console.error('数据加载失败:', err);
                document.querySelectorAll('.chart-wrapper').forEach(el => {
                    el.innerHTML = '<div class="empty-state"><p>数据加载失败</p></div>';
                });
            }
        }

        async function getStreak() {
            try {
                const r = await fetch(`/api/user/${USER_ID}/streak`);
                const d = await r.json();
                return d.streak || 0;
            } catch { return 0; }
        }

        function renderRadarChart(progressData) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            const scores = SCENARIOS.map(id => {
                const p = progressData.find(item => item.scenario_id === id);
                return p ? (p.avg_score || 0) : 0;
            });
            const hasData = scores.some(s => s > 0);

            if (!hasData) {
                showEmpty(ctx, '暂无场景数据');
                return;
            }

            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: SCENARIOS.map(id => SCENARIO_NAMES[id]),
                    datasets: [{
                        label: '平均得分',
                        data: scores,
                        backgroundColor: 'rgba(99, 102, 241, 0.2)',
                        borderColor: '#6366F1',
                        borderWidth: 2,
                        pointBackgroundColor: '#6366F1',
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        r: {
                            beginAtZero: true, max: 100,
                            grid: { color: 'rgba(148, 163, 184, 0.15)' },
                            angleLines: { color: 'rgba(148, 163, 184, 0.15)' },
                            pointLabels: { color: '#94A3B8', font: { size: 11 } },
                            ticks: { color: '#94A3B8', backdropColor: 'transparent', stepSize: 20 }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#94A3B8' } }
                    }
                }
            });
        }

        function renderTrendChart(progressData) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            // 从所有场景的 latest_scores 中收集分数
            const allEntries = [];
            progressData.forEach(p => {
                const scores = p.latest_scores || [];
                scores.forEach((s, idx) => {
                    allEntries.push({ index: allEntries.length, score: s, scenario: p.scenario_name || '' });
                });
            });

            if (allEntries.length === 0) {
                showEmpty(ctx, '暂无趋势数据');
                return;
            }

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: allEntries.map((_, i) => `第${i + 1}次`),
                    datasets: [{
                        label: '得分趋势',
                        data: allEntries.map(e => e.score),
                        borderColor: '#6366F1',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#6366F1',
                        pointRadius: 4,
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, max: 100, grid: { color: 'rgba(148, 163, 184, 0.1)' }, ticks: { color: '#94A3B8' } },
                        x: { grid: { display: false }, ticks: { color: '#94A3B8' } }
                    },
                    plugins: {
                        legend: { labels: { color: '#94A3B8' } }
                    }
                }
            });
        }

        function renderBarChart(progressData) {
            const ctx = document.getElementById('barChart').getContext('2d');
            const labels = SCENARIOS.map(id => SCENARIO_NAMES[id]);
            const avgs = SCENARIOS.map(id => {
                const p = progressData.find(item => item.scenario_id === id);
                return p ? (p.avg_score || 0) : 0;
            });
            const practices = SCENARIOS.map(id => {
                const p = progressData.find(item => item.scenario_id === id);
                return p ? (p.total_practices || 0) : 0;
            });
            const hasData = avgs.some(s => s > 0);

            if (!hasData) {
                showEmpty(ctx, '暂无对比数据');
                return;
            }

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [
                        {
                            label: '平均分',
                            data: avgs,
                            backgroundColor: SCENARIO_COLORS.map(c => c + 'CC'),
                            borderColor: SCENARIO_COLORS,
                            borderWidth: 1,
                            yAxisID: 'y',
                        },
                        {
                            label: '练习次数',
                            data: practices,
                            backgroundColor: 'rgba(148, 163, 184, 0.3)',
                            borderColor: '#94A3B8',
                            borderWidth: 1,
                            yAxisID: 'y1',
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, max: 100, grid: { color: 'rgba(148, 163, 184, 0.1)' }, ticks: { color: '#94A3B8' }, position: 'left' },
                        y1: { beginAtZero: true, grid: { display: false }, ticks: { color: '#94A3B8' }, position: 'right' },
                        x: { grid: { display: false }, ticks: { color: '#94A3B8', font: { size: 10 } } }
                    },
                    plugins: {
                        legend: { labels: { color: '#94A3B8', font: { size: 11 } } }
                    }
                }
            });
        }

        function renderDistributionChart(distribution) {
            const ctx = document.getElementById('distributionChart').getContext('2d');
            if (!distribution || Object.values(distribution).every(v => v === 0)) {
                showEmpty(ctx, '暂无分数数据');
                return;
            }
            const bins = ['<60', '60-69', '70-79', '80-89', '90-100'];
            const colors = ['#EF4444', '#F59E0B', '#EAB308', '#10B981', '#6366F1'];
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: bins,
                    datasets: [{
                        data: bins.map(b => distribution[b] || 0),
                        backgroundColor: colors,
                        borderWidth: 0,
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#94A3B8', padding: 12, font: { size: 11 } } }
                    }
                }
            });
        }

        function renderActivityList(answers) {
            const container = document.getElementById('activityContainer');
            if (!answers || answers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>还没有练习记录</h3>
                        <p>开始一次模拟面试，你的练习记录将在这里展示</p>
                        <a href="/" class="btn btn-primary" style="margin-top: 16px;">开始练习</a>
                    </div>`;
                return;
            }

            const recent = answers.slice(0, 15);
            let html = '<ul class="activity-list">';
            recent.forEach(a => {
                const score = a.score || 0;
                const dotClass = score >= 80 ? 'high' : (score >= 60 ? 'medium' : 'low');
                const sName = SCENARIO_NAMES[a.scenario_id] || a.scenario_id || '未知场景';
                const date = a.created_at ? new Date(a.created_at).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
                html += `
                    <li class="activity-item">
                        <div class="activity-info">
                            <span class="activity-dot ${dotClass}"></span>
                            <span class="activity-text">
                                <span class="scenario-tag">${sName}</span>
                                ${a.question_text ? '· ' + a.question_text.substring(0, 30) + (a.question_text.length > 30 ? '...' : '') : ''}
                            </span>
                        </div>
                        <div>
                            <span class="activity-score" style="color: ${dotClass === 'high' ? 'var(--success)' : (dotClass === 'medium' ? 'var(--warning)' : 'var(--danger)')}">${score}分</span>
                            <span style="color: var(--text-secondary); font-size: 0.8rem; margin-left: 8px;">${date}</span>
                        </div>
                    </li>`;
            });
            html += '</ul>';
            container.innerHTML = html;
        }

        function showEmpty(ctx, message) {
            const canvas = ctx.canvas;
            const parent = canvas.parentElement;
            canvas.style.display = 'none';
            const el = document.createElement('div');
            el.className = 'empty-state';
            el.style.padding = '40px 20px';
            el.innerHTML = `<p>${message}</p>`;
            parent.appendChild(el);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
