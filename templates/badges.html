<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>徽章收藏馆 - 面试翻车救援队</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --bg-dark: #2D3436;
            --bg-card: #3A3F44;
            --text-primary: #FFFFFF;
            --text-secondary: #B2BEC3;
            --border: #4A4F55;
            --legendary: #FFD700;
            --epic: #9B59B6;
            --rare: #3498DB;
            --common: #95A5A6;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 40px 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        
        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .page-header p {
            color: var(--text-secondary);
        }
        
        .badges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }
        
        .badge-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: transform 0.3s;
            border: 2px solid transparent;
        }
        
        .badge-card:hover {
            transform: translateY(-8px);
        }
        
        .badge-card.legendary {
            border-color: var(--legendary);
            background: linear-gradient(135deg, rgba(255,215,0,0.1) 0%, rgba(155,89,182,0.05) 100%);
        }
        
        .badge-card.epic {
            border-color: var(--epic);
            background: linear-gradient(135deg, rgba(155,89,182,0.1) 0%, rgba(52,152,219,0.05) 100%);
        }
        
        .badge-card.rare {
            border-color: var(--rare);
            background: linear-gradient(135deg, rgba(52,152,219,0.1) 0%, rgba(78,205,196,0.05) 100%);
        }
        
        .badge-card.common {
            border-color: var(--common);
        }
        
        .badge-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }
        
        .badge-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .badge-card.legendary .badge-name { color: var(--legendary); }
        .badge-card.epic .badge-name { color: var(--epic); }
        .badge-card.rare .badge-name { color: var(--rare); }
        
        .badge-desc {
            color: var(--text-secondary);
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        
        .rarity-tag {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .rarity-tag.legendary {
            background: rgba(255,215,0,0.2);
            color: var(--legendary);
        }
        
        .rarity-tag.epic {
            background: rgba(155,89,182,0.2);
            color: var(--epic);
        }
        
        .rarity-tag.rare {
            background: rgba(52,152,219,0.2);
            color: var(--rare);
        }
        
        .rarity-tag.common {
            background: rgba(149,165,166,0.2);
            color: var(--common);
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: var(--text-secondary);
        }
        
        @media (max-width: 640px) {
            .badges-grid { grid-template-columns: 1fr; }
            .page-header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav-bar">
            <div class="logo">
                <span>🚑</span>
                <span>翻车救援队</span>
            </div>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="/checkin">开始复盘</a>
                <a href="/rescue">话术库</a>
            </div>
        </nav>
        
        <div class="page-header">
            <h1>🏆 徽章收藏馆</h1>
            <p>收集所有徽章，成为面试复盘大师</p>
        </div>
        
        <div class="badges-grid">
            {% for badge in badges %}
            <div class="badge-card {{ badge.rarity }}">
                <div class="badge-icon">{{ badge.icon }}</div>
                <div class="badge-name">{{ badge.name }}</div>
                <div class="badge-desc">{{ badge.description }}</div>
                <div class="rarity-tag {{ badge.rarity }}">
                    {{ badge.rarity == 'legendary' ? '传说' : badge.rarity == 'epic' ? '史诗' : badge.rarity == 'rare' ? '稀有' : '普通' }}
                </div>
            </div>
            {% endfor %}
        </div>
        
        <footer class="footer">
            <p>© 2026 面试翻车救援队</p>
        </footer>
    </div>
</body>
</html>
