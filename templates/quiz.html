<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>引导问答 - 面试翻车救援队</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/effects.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --bg-dark: #2D3436;
            --bg-card: #3A3F44;
            --text-primary: #FFFFFF;
            --text-secondary: #B2BEC3;
            --border: #4A4F55;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 40px 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .card {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            transition: width 0.5s;
        }
        
        .quiz-content {
            padding: 40px;
            text-align: center;
        }
        
        .step-info {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        
        .question-number {
            display: inline-block;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary) 0%, #FF4757 100%);
            border-radius: 50%;
            line-height: 40px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .question-text {
            font-size: 1.4rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .answer-area {
            text-align: left;
        }
        
        .answer-area textarea {
            width: 100%;
            min-height: 150px;
            padding: 20px;
            border: 2px solid var(--border);
            border-radius: 15px;
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
            font-size: 1rem;
            resize: vertical;
            font-family: inherit;
        }
        
        .answer-area textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .btn-group {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #FF4757 100%);
            color: white;
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: var(--text-secondary);
        }
        
        .btn:hover { transform: translateY(-2px); }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .badge-preview {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,107,107,0.1);
            border-radius: 15px;
            display: none;
        }
        
        .badge-preview.show {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .badge-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: var(--text-secondary);
        }
        
        @media (max-width: 640px) {
            .card { padding: 20px; }
            .quiz-content { padding: 25px; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>
<!-- 极光背景 -->
<div class="aurora-bg">
  <div class="aurora-layer"></div>
  <div class="aurora-layer"></div>
  <div class="aurora-layer"></div>
  <div class="aurora-layer"></div>
</div>
    <div class="container">
        <div class="card">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            
            <div class="quiz-content">
                <div class="step-info" id="stepInfo"></div>
                <div class="question-number" id="questionNumber"></div>
                <div class="question-text" id="questionText"></div>
                
                <div class="answer-area">
                    <textarea id="answerInput" placeholder="请输入你的回答..."></textarea>
                </div>
                
                <div class="btn-group">
                    <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">上一步</button>
                    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">下一步</button>
                </div>
                
                <div class="badge-preview" id="badgePreview">
                    <div class="badge-icon">🎁</div>
                    <div>即将解锁新徽章！</div>
                </div>
            </div>
        </div>
        
        <footer class="footer">
            <p>© 2026 面试翻车救援队</p>
        </footer>
    </div>
    
    <script>
        const questions = {{ questions | tojson | safe }};
        const sessionId = '{{ session_id }}';
        let currentIndex = 0;
        const answers = {};
        
        function updateProgress() {
            const progress = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('stepInfo').textContent = `问题 ${currentIndex + 1} / ${questions.length}`;
            document.getElementById('questionNumber').textContent = currentIndex + 1;
            document.getElementById('questionText').textContent = questions[currentIndex].question;
            
            // 加载之前的答案
            document.getElementById('answerInput').value = answers[questions[currentIndex].id] || '';
            
            // 更新按钮状态
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').textContent = currentIndex === questions.length - 1 ? '完成复盘' : '下一步';
            
            // 显示徽章预览
            if (currentIndex === questions.length - 1) {
                document.getElementById('badgePreview').classList.add('show');
            }
        }
        
        function nextQuestion() {
            const answer = document.getElementById('answerInput').value.trim();
            if (!answer) {
                alert('请填写答案');
                return;
            }
            
            answers[questions[currentIndex].id] = answer;
            
            if (currentIndex === questions.length - 1) {
                submitQuiz();
            } else {
                currentIndex++;
                updateProgress();
                document.getElementById('answerInput').focus();
            }
        }
        
        function prevQuestion() {
            if (currentIndex > 0) {
                answers[questions[currentIndex].id] = document.getElementById('answerInput').value.trim();
                currentIndex--;
                updateProgress();
                document.getElementById('answerInput').focus();
            }
        }
        
        async function submitQuiz() {
            const btn = document.getElementById('nextBtn');
            btn.disabled = true;
            btn.textContent = '提交中...';
            
            try {
                const response = await fetch(`/quiz/${sessionId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answers: answers })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = `/result/${sessionId}`;
                } else {
                    alert(data.error || '提交失败');
                }
            } catch (error) {
                alert('网络错误，请重试');
            } finally {
                btn.disabled = false;
                btn.textContent = '完成复盘';
            }
        }
        
        updateProgress();
        document.getElementById('answerInput').focus();
        
        // 回车键提交（非最后一题时）
        document.getElementById('answerInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                nextQuestion();
            }
        });
    </script>
    <script src="/static/js/effects.js"></script>
</body>
</html
