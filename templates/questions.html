<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题库中心 - 百工模拟考场</title>
    <style>
        :root {
            --primary: #60A5FA;
            --primary-hover: #3B82F6;
            --bg-primary: #F8FAFC;
            --bg-secondary: #FFFFFF;
            --bg-card: #FFFFFF;
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --text-tertiary: #94A3B8;
            --border: rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.04);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, SF Pro Display, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
        }
        
        /* 侧边栏 */
        .sidebar {
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo {
            font-size: 1.75rem;
        }
        
        .brand-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .nav-menu {
            flex: 1;
            padding: 12px;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            margin-bottom: 4px;
        }
        
        .nav-item:hover {
            background: rgba(96, 165, 250, 0.08);
            color: var(--primary);
        }
        
        .nav-item.active {
            background: rgba(96, 165, 250, 0.12);
            color: var(--primary);
            font-weight: 500;
        }
        
        .nav-item-icon {
            font-size: 1.2rem;
        }
        
        /* 主内容区 */
        .main-content {
            flex: 1;
            margin-left: 260px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .top-bar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .page-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 0 12px rgba(96, 165, 250, 0.3);
        }
        
        /* 页面内容 */
        .page-content {
            flex: 1;
            padding: 24px;
        }
        
        /* 筛选区域 */
        .filter-section {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
        }
        
        .filter-row {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .filter-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        select, input[type="text"] {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s ease;
            min-width: 160px;
        }
        
        select:focus, input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.08);
        }
        
        .search-box {
            flex: 1;
            max-width: 300px;
        }
        
        /* 难度选择 */
        .difficulty-selector {
            display: flex;
            gap: 4px;
        }
        
        .star {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .star:hover, .star.active {
            background: rgba(96, 165, 250, 0.12);
            border-color: var(--primary);
            color: var(--primary);
        }
        
        /* 题目列表 */
        .questions-grid {
            display: grid;
            gap: 16px;
        }
        
        .question-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        
        .question-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            border-color: rgba(96, 165, 250, 0.3);
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        
        .question-meta {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .tag {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .tag-scenario {
            background: rgba(96, 165, 250, 0.12);
            color: var(--primary);
        }
        
        .tag-category {
            background: rgba(16, 185, 129, 0.12);
            color: #10B981;
        }
        
        .difficulty-stars {
            display: flex;
            gap: 2px;
        }
        
        .difficulty-star {
            font-size: 0.85rem;
            color: #E2E8F0;
        }
        
        .difficulty-star.filled {
            color: #F59E0B;
        }
        
        .question-text {
            font-size: 0.95rem;
            color: var(--text-primary);
            line-height: 1.6;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .question-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .question-tag {
            padding: 3px 8px;
            background: var(--bg-primary);
            border-radius: 4px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        
        /* 弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.2s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            background: var(--bg-secondary);
            border-radius: 16px;
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
        }
        
        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: var(--bg-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: var(--text-secondary);
        }
        
        .modal-body {
            padding: 24px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            resize: vertical;
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s ease;
        }
        
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.08);
        }
        
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }
        
        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: rgba(96, 165, 250, 0.08);
        }
        
        /* 参考答案区域 */
        .answer-section {
            background: rgba(16, 185, 129, 0.05);
            border-radius: 10px;
            padding: 16px;
            margin-top: 16px;
        }
        
        .answer-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #10B981;
            margin-bottom: 8px;
        }
        
        .answer-content {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-tertiary);
        }
        
        .empty-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        
        .empty-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        /* 统计信息 */
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            background: var(--bg-secondary);
            border-radius: 10px;
            padding: 16px 24px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary);
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: relative;
                height: auto;
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .filter-row {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box {
                max-width: none;
            }
            
            .stats-bar {
                justify-content: center;
            }
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/sidebar.css') }}">
</head>
<body>
    {% include 'components/sidebar.html' %}

    <main class="main-content">
        <header class="top-bar">
            <div class="top-bar-left">
                <h1 class="page-title">题库中心</h1>
            </div>
            <button class="btn btn-primary" onclick="openAddModal()">
                <span>+</span>
                <span>添加题目</span>
            </button>
        </header>
        
        <div class="page-content">
            <!-- 统计信息 -->
            <div class="stats-bar" id="statsBar">
                <div class="stat-item">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">题目总数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="scenarioCount">0</div>
                    <div class="stat-label">覆盖场景</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="categoryCount">0</div>
                    <div class="stat-label">题目分类</div>
                </div>
            </div>
            
            <!-- 筛选区域 -->
            <div class="filter-section">
                <div class="filter-row">
                    <div class="filter-group">
                        <label class="filter-label">场景</label>
                        <select id="scenarioFilter" onchange="loadQuestions()">
                            <option value="">全部场景</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">分类</label>
                        <select id="categoryFilter" onchange="loadQuestions()">
                            <option value="">全部分类</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">难度</label>
                        <div class="difficulty-selector" id="difficultySelector">
                            <span class="star" data-value="1" onclick="toggleDifficulty(1)">⭐</span>
                            <span class="star" data-value="2" onclick="toggleDifficulty(2)">⭐</span>
                            <span class="star" data-value="3" onclick="toggleDifficulty(3)">⭐</span>
                            <span class="star" data-value="4" onclick="toggleDifficulty(4)">⭐</span>
                            <span class="star" data-value="5" onclick="toggleDifficulty(5)">⭐</span>
                        </div>
                    </div>
                    <div class="filter-group search-box">
                        <label class="filter-label">搜索</label>
                        <input type="text" id="searchInput" placeholder="搜索题目..." onkeyup="handleSearch()">
                    </div>
                </div>
            </div>
            
            <!-- 题目列表 -->
            <div class="questions-grid" id="questionsContainer">
                <!-- 题目卡片动态生成 -->
            </div>
        </div>
    </main>
    
    <!-- 题目详情弹窗 -->
    <div class="modal-overlay" id="detailModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">题目详情</div>
                <button class="modal-close" onclick="closeDetailModal()">×</button>
            </div>
            <div class="modal-body" id="detailContent">
                <!-- 题目详情动态生成 -->
            </div>
        </div>
    </div>
    
    <!-- 添加题目弹窗 -->
    <div class="modal-overlay" id="addModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">添加新题目</div>
                <button class="modal-close" onclick="closeAddModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">场景</label>
                    <select id="addScenario">
                        <option value="job_interview">求职面试</option>
                        <option value="teacher_cert">教资面试</option>
                        <option value="ielts_speaking">雅思口语</option>
                        <option value="civil_service">公务员面试</option>
                        <option value="graduate_school">考研复试</option>
                        <option value="mba_interview">MBA面试</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">分类</label>
                    <input type="text" id="addCategory" placeholder="如：自我介绍、专业技能">
                </div>
                <div class="form-group">
                    <label class="form-label">难度（1-5星）</label>
                    <div class="difficulty-selector" id="addDifficultySelector">
                        <span class="star" data-value="1" onclick="toggleAddDifficulty(1)">⭐</span>
                        <span class="star" data-value="2" onclick="toggleAddDifficulty(2)">⭐</span>
                        <span class="star" data-value="3" onclick="toggleAddDifficulty(3)">⭐</span>
                        <span class="star" data-value="4" onclick="toggleAddDifficulty(4)">⭐</span>
                        <span class="star" data-value="5" onclick="toggleAddDifficulty(5)">⭐</span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">题目内容</label>
                    <textarea id="addQuestionText" placeholder="请输入题目内容..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">参考答案</label>
                    <textarea id="addReferenceAnswer" placeholder="请输入参考答案或评分要点..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">标签（逗号分隔）</label>
                    <input type="text" id="addTags" placeholder="如：自我介绍, 沟通表达">
                </div>
                <div class="form-actions">
                    <button class="btn btn-secondary" onclick="closeAddModal()">取消</button>
                    <button class="btn btn-primary" onclick="submitQuestion()">提交</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const scenarios = {
            'job_interview': '求职面试',
            'teacher_cert': '教资面试',
            'ielts_speaking': '雅思口语',
            'civil_service': '公务员面试',
            'graduate_school': '考研复试',
            'mba_interview': 'MBA面试'
        };
        
        let selectedDifficulty = null;
        let addDifficulty = 3; // 默认难度
        
        // 页面加载
        document.addEventListener('DOMContentLoaded', () => {
            loadScenarios();
            loadCategories();
            loadQuestions();
        });
        
        // 加载场景列表
        function loadScenarios() {
            const select = document.getElementById('scenarioFilter');
            for (const [key, value] of Object.entries(scenarios)) {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = value;
                select.appendChild(option);
            }
        }
        
        // 加载分类列表
        function loadCategories() {
            fetch('/api/questions/categories')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const select = document.getElementById('categoryFilter');
                        data.data.forEach(category => {
                            const option = document.createElement('option');
                            option.value = category;
                            option.textContent = category;
                            select.appendChild(option);
                        });
                    }
                });
        }
        
        // 加载题目列表
        function loadQuestions() {
            const scenario = document.getElementById('scenarioFilter').value;
            const category = document.getElementById('categoryFilter').value;
            const keyword = document.getElementById('searchInput').value;
            
            let url = '/api/questions';
            const params = [];
            if (scenario) params.push(`scenario=${scenario}`);
            if (category) params.push(`category=${category}`);
            if (selectedDifficulty) params.push(`difficulty=${selectedDifficulty}`);
            if (keyword) params.push(`keyword=${encodeURIComponent(keyword)}`);
            
            if (params.length > 0) {
                url += '?' + params.join('&');
            }
            
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        renderQuestions(data.data);
                        updateStats(data.data);
                    }
                });
        }
        
        // 渲染题目列表
        function renderQuestions(questions) {
            const container = document.getElementById('questionsContainer');
            
            if (questions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <div class="empty-title">暂无题目</div>
                        <div>当前筛选条件下没有找到题目</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = questions.map(q => `
                <div class="question-card" onclick="openDetailModal('${q.id}')">
                    <div class="question-header">
                        <div class="question-meta">
                            <span class="tag tag-scenario">${scenarios[q.scenario]}</span>
                            <span class="tag tag-category">${q.category}</span>
                        </div>
                        <div class="difficulty-stars">
                            ${Array.from({length: 5}, (_, i) => 
                                `<span class="difficulty-star ${i < q.difficulty ? 'filled' : ''}">⭐</span>`
                            ).join('')}
                        </div>
                    </div>
                    <div class="question-text">${q.question_text}</div>
                    <div class="question-tags">
                        ${q.tags.map(tag => `<span class="question-tag">#${tag}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }
        
        // 更新统计信息
        function updateStats(questions) {
            document.getElementById('totalCount').textContent = questions.length;
            
            const uniqueScenarios = new Set(questions.map(q => q.scenario)).size;
            document.getElementById('scenarioCount').textContent = uniqueScenarios;
            
            const uniqueCategories = new Set(questions.map(q => q.category)).size;
            document.getElementById('categoryCount').textContent = uniqueCategories;
        }
        
        // 搜索处理
        function handleSearch() {
            const searchInput = document.getElementById('searchInput');
            if (searchInput.value.length >= 2 || searchInput.value.length === 0) {
                loadQuestions();
            }
        }
        
        // 难度选择
        function toggleDifficulty(value) {
            const stars = document.querySelectorAll('#difficultySelector .star');
            stars.forEach(star => star.classList.remove('active'));
            
            if (selectedDifficulty === value) {
                selectedDifficulty = null;
            } else {
                selectedDifficulty = value;
                stars[value - 1].classList.add('active');
            }
            loadQuestions();
        }
        
        // 添加题目难度选择
        function toggleAddDifficulty(value) {
            const stars = document.querySelectorAll('#addDifficultySelector .star');
            stars.forEach(star => star.classList.remove('active'));
            
            addDifficulty = value;
            for (let i = 0; i < value; i++) {
                stars[i].classList.add('active');
            }
        }
        
        // 打开详情弹窗
        function openDetailModal(questionId) {
            fetch(`/api/questions/${questionId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const q = data.data;
                        document.getElementById('detailContent').innerHTML = `
                            <div class="form-group">
                                <label class="form-label">场景</label>
                                <div class="tag tag-scenario">${scenarios[q.scenario]}</div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">分类</label>
                                <div class="tag tag-category">${q.category}</div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">难度</label>
                                <div class="difficulty-stars">
                                    ${Array.from({length: 5}, (_, i) => 
                                        `<span class="difficulty-star ${i < q.difficulty ? 'filled' : ''}">⭐</span>`
                                    ).join('')}
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">题目内容</label>
                                <textarea readonly>${q.question_text}</textarea>
                            </div>
                            <div class="answer-section">
                                <div class="answer-title">📝 参考答案</div>
                                <div class="answer-content">${q.reference_answer}</div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">标签</label>
                                <div class="question-tags">
                                    ${q.tags.map(tag => `<span class="question-tag">#${tag}</span>`).join('')}
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="btn btn-secondary" onclick="closeDetailModal()">关闭</button>
                                <button class="btn btn-primary" onclick="startPractice('${q.id}')">开始练习</button>
                            </div>
                        `;
                        document.getElementById('detailModal').style.display = 'flex';
                    }
                });
        }
        
        // 关闭详情弹窗
        function closeDetailModal() {
            document.getElementById('detailModal').style.display = 'none';
        }
        
        // 打开添加弹窗
        function openAddModal() {
            // 重置表单
            document.getElementById('addCategory').value = '';
            document.getElementById('addQuestionText').value = '';
            document.getElementById('addReferenceAnswer').value = '';
            document.getElementById('addTags').value = '';
            
            // 重置难度选择
            addDifficulty = 3;
            const stars = document.querySelectorAll('#addDifficultySelector .star');
            stars.forEach((star, i) => {
                star.classList.toggle('active', i < 3);
            });
            
            document.getElementById('addModal').style.display = 'flex';
        }
        
        // 关闭添加弹窗
        function closeAddModal() {
            document.getElementById('addModal').style.display = 'none';
        }
        
        // 提交题目
        function submitQuestion() {
            const scenario = document.getElementById('addScenario').value;
            const category = document.getElementById('addCategory').value;
            const questionText = document.getElementById('addQuestionText').value;
            const referenceAnswer = document.getElementById('addReferenceAnswer').value;
            const tagsInput = document.getElementById('addTags').value;
            
            // 验证
            if (!category.trim()) {
                alert('请输入分类');
                return;
            }
            if (!questionText.trim()) {
                alert('请输入题目内容');
                return;
            }
            if (!referenceAnswer.trim()) {
                alert('请输入参考答案');
                return;
            }
            
            const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(t => t) : [];
            
            fetch('/api/questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    scenario,
                    category,
                    difficulty: addDifficulty,
                    question_text: questionText,
                    reference_answer: referenceAnswer,
                    tags
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('题目添加成功！');
                    closeAddModal();
                    loadQuestions();
                } else {
                    alert('添加失败：' + data.error);
                }
            });
        }
        
        // 开始练习
        function startPractice(questionId) {
            closeDetailModal();
            window.location.href = `/practice?question_id=${questionId}`;
        }
        
        // 点击弹窗外部关闭
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('detailModal')) {
                closeDetailModal();
            }
        });
        
        document.getElementById('addModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('addModal')) {
                closeAddModal();
            }
        });
    </script>
    <script src="{{ url_for('static', filename='js/components/sidebar.js') }}"></script>
</body>
</html>
