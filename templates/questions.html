<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真题题库 — 百工</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <style>
        /* ================================================================
           题库页 — 专属样式
        ================================================================ */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .filter-select {
            padding: 8px 14px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            font-size: 13px;
            color: var(--gray-600);
            background: #fff;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
            min-width: 120px;
            font-family: inherit;
        }
        .filter-select:focus { border-color: var(--blue-400); }

        .search-input {
            padding: 8px 14px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            font-size: 13px;
            color: var(--gray-600);
            background: #fff;
            outline: none;
            transition: border-color 0.2s;
            width: 200px;
            font-family: inherit;
        }
        .search-input:focus { border-color: var(--blue-400); }
        .search-input::placeholder { color: var(--gray-400); }

        /* Difficulty stars */
        .diff-stars {
            display: flex;
            gap: 2px;
        }
        .diff-star {
            font-size: 14px;
            color: var(--gray-200);
            cursor: pointer;
            transition: color 0.15s;
        }
        .diff-star.filled,
        .diff-star.active { color: #f59e0b; }
        .diff-star:hover { color: #f59e0b; }

        /* Stats bar */
        .stats-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-box {
            padding: 16px 24px;
            background: var(--gray-50);
            border: 1px solid var(--gray-100);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .stat-box .value {
            font-size: 22px;
            font-weight: 700;
            color: var(--blue-500);
            letter-spacing: -0.03em;
        }
        .stat-box .label {
            font-size: 12px;
            color: var(--gray-400);
        }

        /* Question list */
        .q-list { display: flex; flex-direction: column; gap: 12px; }

        .q-card {
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: 12px;
            padding: 20px 24px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .q-card:hover {
            border-color: var(--blue-200);
            box-shadow: 0 4px 16px -8px rgba(59,130,246,0.08);
        }
        .q-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .q-card-tags {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .q-tag {
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }
        .q-tag.scenario { background: var(--blue-50); color: var(--blue-600); }
        .q-tag.category { background: var(--gray-50); color: var(--gray-500); }
        .q-text {
            font-size: 15px;
            color: var(--gray-700);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .q-bottom {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .q-label {
            padding: 2px 8px;
            background: var(--gray-50);
            border-radius: 4px;
            font-size: 11px;
            color: var(--gray-400);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.40);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal {
            background: #fff;
            border-radius: 20px;
            width: 90%;
            max-width: 640px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 24px 48px -12px rgba(0,0,0,0.20);
            animation: slideUp 0.25s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-100);
            position: sticky;
            top: 0;
            background: #fff;
        }
        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-900);
        }
        .modal-close {
            width: 32px; height: 32px;
            border-radius: 8px;
            border: none;
            background: var(--gray-50);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray-400);
            font-size: 18px;
            transition: background 0.2s;
        }
        .modal-close:hover { background: var(--gray-100); }
        .modal-body { padding: 24px; }

        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 8px;
        }
        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: var(--gray-700);
            background: #fff;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus { border-color: var(--blue-400); }
        .form-textarea { min-height: 100px; resize: vertical; }
        .form-textarea[readonly] { background: var(--gray-50); color: var(--gray-500); }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .answer-box {
            background: var(--gray-50);
            border-radius: 10px;
            padding: 16px;
            margin-top: 8px;
        }
        .answer-box .label {
            font-size: 12px;
            font-weight: 600;
            color: var(--blue-500);
            margin-bottom: 8px;
        }
        .answer-box .content {
            font-size: 14px;
            color: var(--gray-600);
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* 题目详情 — 元数据样式 */
        .detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .detail-meta .meta-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }
        .meta-tag.company { background: #e0f2fe; color: #0369a1; }
        .meta-tag.position { background: #ede9fe; color: #6d28d9; }
        .meta-tag.source { background: #fef3c7; color: #92400e; }
        .meta-tag.year { background: #d1fae5; color: #065f46; }
        .meta-tag.difficulty-label { background: #fce7f3; color: #9d174d; }

        .detail-section {
            margin-bottom: 20px;
        }
        .detail-section .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-500);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .detail-section .section-title svg {
            width: 16px;
            height: 16px;
        }
        .detail-question {
            font-size: 16px;
            color: var(--gray-900);
            line-height: 1.6;
            font-weight: 500;
            padding: 16px;
            background: var(--gray-50);
            border-radius: 10px;
        }
        .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .detail-tags .q-label {
            padding: 3px 10px;
            background: var(--gray-50);
            border-radius: 6px;
            font-size: 12px;
            color: var(--gray-500);
        }

        @media (max-width: 768px) {
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar-left { flex-wrap: wrap; }
            .search-input { width: 100%; }
            .stats-bar { flex-wrap: wrap; }
            .stat-box { flex: 1; min-width: 80px; }
        }
    </style>
</head>
<body>
    {% include 'components/nav.html' %}

    <main>
        <div class="container">
            <div class="page-header">
                <div class="section-label">刷题</div>
                <h1>真题题库</h1>
                <p>按场景、分类、难度筛选，点击题目查看详情和参考答案。</p>
            </div>

            <!-- Stats -->
            <div class="stats-bar" id="statsBar">
                <div class="stat-box">
                    <div class="value" id="totalCount">0</div>
                    <div class="label">题目总数</div>
                </div>
                <div class="stat-box">
                    <div class="value" id="scenarioCount">0</div>
                    <div class="label">覆盖场景</div>
                </div>
                <div class="stat-box">
                    <div class="value" id="categoryCount">0</div>
                    <div class="label">题目分类</div>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <div class="toolbar-left">
                    <select class="filter-select" id="scenarioFilter" onchange="onFilterChange()">
                        <option value="">全部场景</option>
                    </select>
                    <select class="filter-select" id="categoryFilter" onchange="onFilterChange()">
                        <option value="">全部分类</option>
                    </select>
                    <select class="filter-select" id="companyFilter" onchange="onFilterChange()">
                        <option value="">全部公司</option>
                    </select>
                    <select class="filter-select" id="positionFilter" onchange="onFilterChange()">
                        <option value="">全部岗位</option>
                    </select>
                    <select class="filter-select" id="yearFilter" onchange="onFilterChange()">
                        <option value="">全部年份</option>
                    </select>
                    <select class="filter-select" id="sourceTypeFilter" onchange="onFilterChange()">
                        <option value="">全部来源</option>
                        <option value="real_interview">面经</option>
                        <option value="open_source">开源资料</option>
                        <option value="ai_generated">AI 整理</option>
                    </select>
                    <div class="diff-stars" id="difficultySelector">
                        <span class="diff-star" data-value="1" onclick="toggleDifficulty(1)">★</span>
                        <span class="diff-star" data-value="2" onclick="toggleDifficulty(2)">★</span>
                        <span class="diff-star" data-value="3" onclick="toggleDifficulty(3)">★</span>
                        <span class="diff-star" data-value="4" onclick="toggleDifficulty(4)">★</span>
                        <span class="diff-star" data-value="5" onclick="toggleDifficulty(5)">★</span>
                    </div>
                </div>
                <div class="toolbar-right">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索题目..." onkeyup="handleSearch()">
                    <button class="btn btn-primary" onclick="openAddModal()" style="padding:8px 18px;font-size:13px;white-space:nowrap;">
                        <span>+</span> 添加题目
                    </button>
                </div>
            </div>

            <!-- Question list -->
            <div class="q-list" id="questionsContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <h3>暂无题目</h3>
                    <p>当前筛选条件下没有找到题目，试试调整筛选条件。</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <a href="/" class="nav-logo">百<span>工</span></a>
            <span class="copyright">AI 模拟面试平台</span>
        </div>
    </footer>

    <!-- Detail modal -->
    <div class="modal-overlay" id="detailModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h2>题目详情</h2>
                <button class="modal-close" onclick="closeDetailModal()">×</button>
            </div>
            <div class="modal-body" id="detailContent"></div>
        </div>
    </div>

    <!-- Add modal -->
    <div class="modal-overlay" id="addModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h2>添加新题目</h2>
                <button class="modal-close" onclick="closeAddModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">场景</label>
                    <select class="form-select" id="addScenario">
                        <option value="job_interview">求职面试</option>
                        <option value="teacher_cert">教资面试</option>
                        <option value="ielts_speaking">雅思口语</option>
                        <option value="civil_service">公务员面试</option>
                        <option value="graduate_school">考研复试</option>
                        <option value="mba_interview">MBA面试</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">分类</label>
                    <input class="form-input" id="addCategory" placeholder="如：自我介绍、专业技能">
                </div>
                <div class="form-group">
                    <label class="form-label">难度</label>
                    <div class="diff-stars" id="addDifficultySelector">
                        <span class="diff-star" data-value="1" onclick="toggleAddDifficulty(1)">★</span>
                        <span class="diff-star" data-value="2" onclick="toggleAddDifficulty(2)">★</span>
                        <span class="diff-star" data-value="3" onclick="toggleAddDifficulty(3)">★</span>
                        <span class="diff-star" data-value="4" onclick="toggleAddDifficulty(4)">★</span>
                        <span class="diff-star" data-value="5" onclick="toggleAddDifficulty(5)">★</span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">题目内容</label>
                    <textarea class="form-textarea" id="addQuestionText" placeholder="请输入题目内容..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">参考答案</label>
                    <textarea class="form-textarea" id="addReferenceAnswer" placeholder="请输入参考答案或评分要点..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">来源类型</label>
                    <select class="form-select" id="addSourceType">
                        <option value="ai_generated">AI 整理</option>
                        <option value="real_interview">面经</option>
                        <option value="open_source">开源资料</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">标签（逗号分隔）</label>
                    <input class="form-input" id="addTags" placeholder="如：自我介绍, 沟通表达">
                </div>
                <div class="form-actions">
                    <button class="btn btn-secondary" onclick="closeAddModal()">取消</button>
                    <button class="btn btn-primary" onclick="submitQuestion()">提交</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scenarios = {
            'job_interview': '求职面试',
            'teacher_cert': '教资面试',
            'ielts_speaking': '雅思口语',
            'civil_service': '公务员面试',
            'graduate_school': '考研复试',
            'mba_interview': 'MBA面试'
        };

        let selectedDifficulty = null;
        let addDifficulty = 3;

        document.addEventListener('DOMContentLoaded', () => {
            loadScenarios();
            loadCategories();
            loadFilterOptions('companies', 'companyFilter');
            loadFilterOptions('positions', 'positionFilter');
            loadFilterOptions('years', 'yearFilter');
            loadQuestions();
        });

        function loadScenarios() {
            const select = document.getElementById('scenarioFilter');
            for (const [key, value] of Object.entries(scenarios)) {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = value;
                select.appendChild(option);
            }
        }

        function loadCategories() {
            fetch('/api/questions/categories')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const select = document.getElementById('categoryFilter');
                        data.data.forEach(category => {
                            const option = document.createElement('option');
                            option.value = category;
                            option.textContent = category;
                            select.appendChild(option);
                        });
                    }
                });
        }

        function loadFilterOptions(endpoint, selectId) {
            const scenario = document.getElementById('scenarioFilter').value;
            let url = '/api/questions/' + endpoint;
            if (scenario) url += '?scenario=' + scenario;
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const select = document.getElementById(selectId);
                        const currentVal = select.value;
                        // Preserve first option ("全部XX"), clear rest
                        while (select.options.length > 1) select.remove(1);
                        data.data.forEach(value => {
                            const option = document.createElement('option');
                            option.value = value;
                            option.textContent = value;
                            select.appendChild(option);
                        });
                        // Restore selection if still valid
                        if (currentVal) select.value = currentVal;
                    }
                });
        }

        function onFilterChange() {
            // 当场景变化时重新加载公司和岗位筛选选项
            loadFilterOptions('companies', 'companyFilter');
            loadFilterOptions('positions', 'positionFilter');
            loadFilterOptions('years', 'yearFilter');
            loadQuestions();
        }

        function loadQuestions() {
            const scenario = document.getElementById('scenarioFilter').value;
            const category = document.getElementById('categoryFilter').value;
            const company = document.getElementById('companyFilter').value;
            const position = document.getElementById('positionFilter').value;
            const year = document.getElementById('yearFilter').value;
            const sourceType = document.getElementById('sourceTypeFilter').value;
            const keyword = document.getElementById('searchInput').value;

            let url = '/api/questions';
            const params = [];
            if (scenario) params.push('scenario=' + scenario);
            if (category) params.push('category=' + encodeURIComponent(category));
            if (company) params.push('company=' + encodeURIComponent(company));
            if (position) params.push('position=' + encodeURIComponent(position));
            if (year) params.push('year=' + encodeURIComponent(year));
            if (sourceType) params.push('source_type=' + encodeURIComponent(sourceType));
            if (selectedDifficulty) params.push('difficulty=' + selectedDifficulty);
            if (keyword) params.push('keyword=' + encodeURIComponent(keyword));
            if (params.length > 0) url += '?' + params.join('&');

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        renderQuestions(data.data);
                        updateStats(data.data);
                    }
                });
        }

        function renderQuestions(questions) {
            const container = document.getElementById('questionsContainer');
            if (questions.length === 0) {
                container.innerHTML =
                    '<div class="empty-state">' +
                    '<div class="empty-state-icon">📭</div>' +
                    '<h3>暂无题目</h3>' +
                    '<p>当前筛选条件下没有找到题目。</p>' +
                    '</div>';
                return;
            }
            container.innerHTML = questions.map(q =>
                '<div class="q-card" onclick="openDetailModal(\'' + q.id + '\')">' +
                '<div class="q-card-top">' +
                '<div class="q-card-tags">' +
                '<span class="q-tag scenario">' + (scenarios[q.scenario] || q.scenario) + '</span>' +
                '<span class="q-tag category">' + q.category + '</span>' +
                (q.company ? '<span class="q-tag" style="background:#e0f2fe;color:#0369a1;font-size:11px;">' + escapeHtml(q.company) + '</span>' : '') +
                '</div>' +
                '<div class="diff-stars">' +
                Array.from({length: 5}, (_, i) =>
                    '<span class="diff-star ' + (i < q.difficulty ? 'filled' : '') + '">★</span>'
                ).join('') +
                '</div>' +
                '</div>' +
                '<div class="q-text">' + escapeHtml(q.question_text || '') + '</div>' +
                '<div class="q-bottom">' +
                (q.company ? '<span class="q-label">' + escapeHtml(q.company) + '</span>' : '') +
                (q.position ? '<span class="q-label">' + escapeHtml(q.position) + '</span>' : '') +
                (q.year ? '<span class="q-label">' + q.year + '</span>' : '') +
                (q.source_type ? '<span class="q-label" style="background:' + (q.source_type === 'real_interview' ? '#fef3c7;color:#92400e' : q.source_type === 'open_source' ? '#ede9fe;color:#6d28d9' : '#d1fae5;color:#065f46') + '">' + ({'real_interview':'面经','open_source':'开源','ai_generated':'AI'}[q.source_type] || q.source_type) + '</span>' : '') +
                '</div>' +
                '</div>'
            ).join('');
        }

        function updateStats(questions) {
            document.getElementById('totalCount').textContent = questions.length;
            const uniqueScenarios = new Set(questions.map(q => q.scenario)).size;
            document.getElementById('scenarioCount').textContent = uniqueScenarios;
            const uniqueCategories = new Set(questions.map(q => q.category)).size;
            document.getElementById('categoryCount').textContent = uniqueCategories;
        }

        function handleSearch() {
            const val = document.getElementById('searchInput').value;
            if (val.length >= 2 || val.length === 0) loadQuestions();
        }

        function toggleDifficulty(value) {
            const stars = document.querySelectorAll('#difficultySelector .diff-star');
            stars.forEach(s => s.classList.remove('active'));
            if (selectedDifficulty === value) {
                selectedDifficulty = null;
            } else {
                selectedDifficulty = value;
                stars[value - 1].classList.add('active');
            }
            loadQuestions();
        }

        function toggleAddDifficulty(value) {
            const stars = document.querySelectorAll('#addDifficultySelector .diff-star');
            stars.forEach(s => s.classList.remove('active'));
            addDifficulty = value;
            for (let i = 0; i < value; i++) stars[i].classList.add('active');
        }

        function openDetailModal(questionId) {
            fetch('/api/questions/' + questionId)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const q = data.data;
                        const metaTags = [];
                        if (q.company) metaTags.push('<span class="meta-tag company">\uD83C\uDFED ' + escapeHtml(q.company) + '</span>');
                        if (q.position) metaTags.push('<span class="meta-tag position">\uD83D\uDCBC ' + escapeHtml(q.position) + '</span>');
                        if (q.source) metaTags.push('<span class="meta-tag source">\uD83D\uDCC4 ' + escapeHtml(q.source) + '</span>');
                        if (q.year) metaTags.push('<span class="meta-tag year">\uD83D\uDCC5 ' + q.year + '</span>');
                        if (q.source_type) metaTags.push('<span class="meta-tag year">\uD83D\uDCC4 ' + ({'real_interview':'面经','open_source':'开源资料','ai_generated':'AI整理'}[q.source_type] || q.source_type) + '</span>');
                        metaTags.push('<span class="meta-tag difficulty-label">' + '\u2B50'.repeat(q.difficulty) + ' ' + ['','简单','较易','中等','较难','困难'][q.difficulty] + '</span>');

                        document.getElementById('detailContent').innerHTML =
                            // Metadata badges
                            '<div class="detail-meta">' + metaTags.join('') + '</div>' +

                            // Scenario & Category
                            '<div style="display:flex;gap:8px;margin-bottom:16px;">' +
                            '<span class="q-tag scenario">' + (scenarios[q.scenario] || q.scenario) + '</span>' +
                            '<span class="q-tag category">' + q.category + '</span>' +
                            '</div>' +

                            // Question text
                            '<div class="detail-section">' +
                            '<div class="section-title">' +
                            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' +
                            '面试题目</div>' +
                            '<div class="detail-question">' + escapeHtml(q.question_text) + '</div>' +
                            '</div>' +

                            // Reference answer
                            '<div class="detail-section">' +
                            '<div class="section-title">' +
                            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>' +
                            '参考答案与评分要点</div>' +
                            '<div class="answer-box">' +
                            '<div class="content">' + escapeHtml(q.reference_answer || '暂无参考答案') + '</div>' +
                            '</div>' +
                            '</div>' +

                            // Tags
                            (q.tags && q.tags.length > 0 ?
                                '<div class="detail-section">' +
                                '<div class="section-title">' +
                                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>' +
                                '标签</div>' +
                                '<div class="detail-tags">' +
                                q.tags.map(t => '<span class="q-label">#' + escapeHtml(t) + '</span>').join('') +
                                '</div></div>' : ''
                            ) +

                            // Actions
                            '<div class="form-actions">' +
                            '<button class="btn btn-secondary" onclick="closeDetailModal()">关闭</button>' +
                            '<button class="btn btn-primary" onclick="startPractice(\'' + q.id + '\')">开始练习</button>' +
                            '</div>';
                        document.getElementById('detailModal').style.display = 'flex';
                    }
                });
        }

        function closeDetailModal() { document.getElementById('detailModal').style.display = 'none'; }

        function openAddModal() {
            document.getElementById('addCategory').value = '';
            document.getElementById('addQuestionText').value = '';
            document.getElementById('addReferenceAnswer').value = '';
            document.getElementById('addTags').value = '';
            addDifficulty = 3;
            const stars = document.querySelectorAll('#addDifficultySelector .diff-star');
            stars.forEach((s, i) => s.classList.toggle('active', i < 3));
            document.getElementById('addModal').style.display = 'flex';
        }

        function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }

        function submitQuestion() {
            const scenario = document.getElementById('addScenario').value;
            const category = document.getElementById('addCategory').value.trim();
            const questionText = document.getElementById('addQuestionText').value.trim();
            const referenceAnswer = document.getElementById('addReferenceAnswer').value.trim();
            const tagsInput = document.getElementById('addTags').value.trim();
            if (!category) { alert('请输入分类'); return; }
            if (!questionText) { alert('请输入题目内容'); return; }
            if (!referenceAnswer) { alert('请输入参考答案'); return; }
            const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(t => t) : [];
            const sourceType = document.getElementById('addSourceType').value;
            fetch('/api/questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    scenario, category, difficulty: addDifficulty,
                    question_text: questionText, reference_answer: referenceAnswer, tags,
                    source_type: sourceType
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('题目添加成功！');
                    closeAddModal();
                    loadQuestions();
                } else {
                    alert('添加失败：' + data.error);
                }
            });
        }

        function startPractice(questionId) {
            closeDetailModal();
            window.location.href = '/practice?question_id=' + questionId;
        }

        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) closeDetailModal();
        });
        document.getElementById('addModal').addEventListener('click', function(e) {
            if (e.target === this) closeAddModal();
        });

        function escapeHtml(text) {
            var d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }
    </script>
</body>
</html>
