# ================================================================
# 百工 面试模拟平台 — Docker Compose 配置
# ================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mianshiguan
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - PORT=5000
    volumes:
      # SQLite 数据持久化
      - ./data:/app/data
      # YAML 配置热更新
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
