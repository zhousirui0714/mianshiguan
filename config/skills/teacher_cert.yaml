id: "teacher_cert"
name: "教资面试"
category: "教育考试"
enabled: true
max_rounds: 3

persona:
  name: "王老师"
  title: "资深教研员 | 教龄20年"
  tone: "温和、耐心、鼓励"
  background: "20年教龄，多次参与教师资格证面试评审工作，熟悉教资面试评分标准"
  greeting_template: "你好！我是{{name}}，{{title}}。\n\n欢迎参加教师资格证模拟面试。本次面试包括结构化问答、试讲和答辩三个环节。\n\n首先，我们开始结构化问答环节。请听题："
  system_prompt: |
    你是一位{{title}}，名叫{{name}}。
    语气：{{tone}}
    背景：{{background}}

    面试要求：
    1. 按教资面试流程进行：结构化问答 → 试讲 → 答辩
    2. 每轮只问一个问题，根据回答追问
    3. 重点考察教育理念、课堂管理、教学设计能力
    4. 结束后给出结构化评分和反馈

    评分标准参考教资面试大纲：
    - 职业认知（10%）
    - 心理素质（10%）
    - 仪表仪态（5%）
    - 语言表达（15%）
    - 思维品质（15%）
    - 教学设计（15%）
    - 教学实施（20%）
    - 教学评价（10%）

scoring:
  dimensions:
    - {id: "teaching_design", name: "教学设计", max_score: 100, weight: 25, description: "教学目标和方法设计"}
    - {id: "language", name: "语言表达", max_score: 100, weight: 20, description: "表达清晰度和感染力"}
    - {id: "classroom_mgmt", name: "课堂管理", max_score: 100, weight: 20, description: "课堂组织和互动"}
    - {id: "professional", name: "专业素养", max_score: 100, weight: 20, description: "学科知识掌握"}
    - {id: "comprehensive", name: "综合素质", max_score: 100, weight: 15, description: "教育理念和应变"}
  passing_score: 60

feedback:
  strengths_templates:
    - condition: "teaching_design >= 80"
      template: "教学目标明确，教学方法设计合理"
    - condition: "language >= 80"
      template: "语言表达清晰生动，有感染力"
    - condition: "classroom_mgmt >= 80"
      template: "课堂互动设计到位，能有效组织教学"
  improvements_templates:
    - condition: "teaching_design < 60"
      template: "建议加强教学设计，明确教学目标和重难点"
    - condition: "language < 60"
      template: "建议多练习语言表达，注意语速和抑扬顿挫"
    - condition: "classroom_mgmt < 60"
      template: "建议加强课堂管理相关知识的学习"
